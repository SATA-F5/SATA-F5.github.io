<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神秘工具集合</title>
<style>
  :root{
    --bg:#0e1015;
    --panel:rgba(255,255,255,.045);
    --panel-hover:rgba(255,255,255,.09);
    --border:rgba(255,255,255,.09);
    --text:#e8eaf0;
    --muted:#8b93a7;
    --accent:#6ea8fe;
    --shadow:0 10px 28px rgba(0,0,0,.38);
    --glow1:rgba(110,168,254,.16);
    --glow2:rgba(176,120,255,.13);
  }
  html[data-theme="light"]{
    --bg:#f4f6fb;
    --panel:#ffffff;
    --panel-hover:#ffffff;
    --border:#e4e7f0;
    --text:#191c24;
    --muted:#6b7280;
    --accent:#3b82f6;
    --shadow:0 10px 26px rgba(24,39,75,.10);
    --glow1:rgba(110,168,254,.22);
    --glow2:rgba(176,120,255,.16);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    transition:background .25s ease,color .25s ease;
  }
  body::before{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(620px 420px at 10% -10%, var(--glow1), transparent 62%),
      radial-gradient(760px 520px at 94% 4%, var(--glow2), transparent 62%);
  }

  .app{
    position:relative; z-index:1;
    max-width:1160px;
    margin:0 auto;
    padding:34px 20px 70px;
  }

  /* ---------- 顶部 ---------- */
  header{ margin-bottom:26px; }
  .top{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:16px; flex-wrap:wrap;
  }
  h1{
    margin:0;
    font-size:24px;
    letter-spacing:.04em;
    font-weight:700;
  }
  h1 span{ color:var(--accent); }
  .sub{
    margin:6px 0 0;
    font-size:13px;
    color:var(--muted);
  }
  .theme-btn{
    flex:none;
    width:38px; height:38px;
    display:grid; place-items:center;
    border-radius:11px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    cursor:pointer;
    transition:.18s ease;
  }
  .theme-btn:hover{ background:var(--panel-hover); transform:translateY(-1px); }
  .theme-btn svg{ display:none; }
  html[data-theme="dark"]  .theme-btn .i-sun{ display:block; }
  html[data-theme="light"] .theme-btn .i-moon{ display:block; }

  /* ---------- 搜索 ---------- */
  .searchwrap{
    position:relative;
    margin-top:22px;
    max-width:440px;
  }
  .searchwrap .sicon{
    position:absolute; left:13px; top:50%; transform:translateY(-50%);
    opacity:.55; pointer-events:none; display:grid; place-items:center;
  }
  #search{
    width:100%;
    padding:12px 14px 12px 38px;
    font-size:14px;
    font-family:inherit;
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    outline:none;
    transition:.18s ease;
    -webkit-appearance:none;
    appearance:none;
  }
  #search::placeholder{ color:var(--muted); }
  #search:focus{
    border-color:var(--accent);
    background:var(--panel-hover);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }

  /* ---------- 分组 ---------- */
  .group{ margin-top:30px; }
  .group-head{
    display:flex; align-items:center; gap:8px;
    margin-bottom:12px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.06em;
    color:var(--muted);
  }
  .group-head em{
    font-style:normal;
    font-size:11px;
    padding:1px 7px;
    border-radius:20px;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--muted);
  }
  .group-head::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, var(--border), transparent);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(178px, 1fr));
    gap:11px;
  }

  /* ---------- 卡片 ---------- */
  .card{
    position:relative;
    overflow:hidden;
    display:flex; align-items:center; gap:11px;
    padding:12px 12px 12px 14px;
    min-width:0;
    border-radius:14px;
    background:var(--panel);
    border:1px solid var(--border);
    color:inherit;
    text-decoration:none;
    transition:transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  /* 本地页面左侧色条 */
  .card[data-local="1"]::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0;
    width:3px;
    background:linear-gradient(180deg,
      hsl(var(--h) 72% 62%),
      hsl(calc(var(--h) + 46) 72% 62%));
  }
  .card:hover{
    background:var(--panel-hover);
    border-color:color-mix(in srgb, var(--accent) 55%, var(--border));
    transform:translateY(-2px);
    box-shadow:var(--shadow);
  }
  .card:active{ transform:translateY(0); }

  /* ---------- 图标（favicon 图片 + 文字回退） ---------- */
  .ico{
    position:relative;
    flex:none;
    width:34px; height:34px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:hsl(var(--h) 70% 55% / .16);
    border:1px solid hsl(var(--h) 70% 55% / .26);
    overflow:hidden;
  }
  html[data-theme="light"] .ico{
    background:hsl(var(--h) 75% 50% / .11);
    border-color:hsl(var(--h) 70% 50% / .22);
  }
  .ico > *{ grid-area:1 / 1; }

  .ico .ico-letter{
    font-size:12px;
    font-weight:700;
    letter-spacing:.02em;
    font-variant-numeric:tabular-nums;
    color:hsl(var(--h) 78% 70%);
    user-select:none;
  }
  html[data-theme="light"] .ico .ico-letter{
    color:hsl(var(--h) 68% 38%);
  }

  .ico img{
    width:22px;
    height:22px;
    object-fit:contain;
    opacity:0;
    transition:opacity .2s ease;
  }
  .ico.has-img img{ opacity:1; }
  .ico.has-img .ico-letter{ visibility:hidden; }

  /* ---------- 文字 ---------- */
  .meta{ min-width:0; display:flex; flex-direction:column; gap:2px; }
  .meta b{
    font-size:13.5px;
    font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .meta small{
    font-size:11.5px;
    color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* ---------- 空状态 / 页脚 ---------- */
  .empty{
    margin-top:60px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }
  .empty b{ color:var(--text); }

  footer{
    margin-top:54px;
    padding-top:18px;
    border-top:1px solid var(--border);
    font-size:12px;
    color:var(--muted);
    display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  kbd{
    font-family:inherit;
    font-size:11px;
    padding:1px 6px;
    border-radius:5px;
    border:1px solid var(--border);
    background:var(--panel);
  }

  @media (max-width:520px){
    .app{ padding:24px 14px 60px; }
    h1{ font-size:20px; }
    .grid{ grid-template-columns:repeat(auto-fill, minmax(148px, 1fr)); gap:9px; }
    .card{ padding:10px 10px 10px 12px; gap:9px; }
    .ico{ width:30px; height:30px; font-size:11px; }
    .ico img{ width:20px; height:20px; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="top">
      <div>
        <h1>分流<span>台</span></h1>
        <p class="sub" id="sub">杂项网页 · 快速跳转</p>
      </div>

      <button class="theme-btn" id="themeBtn" title="切换浅色 / 深色" aria-label="切换浅色或深色主题">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.1"/>
          <path d="M12 2.4v2.3M12 19.3v2.3M2.4 12h2.3M19.3 12h2.3M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/>
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.2 14.6A8.3 8.3 0 0 1 9.4 3.8a8.5 8.5 0 1 0 10.8 10.8Z"/>
        </svg>
      </button>
    </div>

    <div class="searchwrap">
      <span class="sicon">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="6.4"/>
          <path d="M16 16l4.2 4.2"/>
        </svg>
      </span>
      <input id="search" type="search" placeholder="搜索站点…（按 / 聚焦）" autocomplete="off" spellcheck="false">
    </div>
  </header>

  <main id="board"></main>

  <footer>
    <span>按 <kbd>/</kbd> 搜索 · <kbd>Esc</kbd> 清空 · 左侧色条为本地页面</span>
    <span>本地页面自动匹配 MS_site 文件夹下的同名图标</span>
  </footer>
</div>

<script>
/* =========================================================
   数据配置区
   ========================================================= */
const SITES = [
  {
    cat: "本地杂项页",
    items: [
      // 注意：因为你的 MS_site 文件夹里文件名是 ms_site1.html，所以这里带上 ms_ 前缀
      { name: "分页测试仪", desc: "本地页面", url: "./MS_site/ms_site1.html",  tag: "01" },
      { name: "声场反应堆", desc: "本地页面", url: "./MS_site/ms_site2.html",  tag: "02" },
      { name: "杂项页 03", desc: "本地页面", url: "./MS_site/ms_site3.html",  tag: "03" },
      { name: "杂项页 04", desc: "本地页面", url: "./MS_site/ms_site4.html",  tag: "04" },
      { name: "杂项页 05", desc: "本地页面", url: "./MS_site/ms_site5.html",  tag: "05" },
      { name: "杂项页 06", desc: "本地页面", url: "./MS_site/ms_site6.html",  tag: "06" },
      { name: "杂项页 07", desc: "本地页面", url: "./MS_site/ms_site7.html",  tag: "07" },
      { name: "杂项页 08", desc: "本地页面", url: "./MS_site/ms_site8.html",  tag: "08" },
      { name: "杂项页 09", desc: "本地页面", url: "./MS_site/ms_site9.html",  tag: "09" },
      { name: "杂项页 10", desc: "本地页面", url: "./MS_site/ms_site10.html", tag: "10" }
    ]
  },
  {
    cat: "常用",
    items: [
      { name: "百度",    desc: "搜索",     url: "https://www.baidu.com" },
      { name: "知乎",    desc: "问答社区", url: "https://www.zhihu.com" },
      { name: "B 站",   desc: "视频弹幕", url: "https://www.bilibili.com" },
      { name: "GitHub", desc: "代码托管", url: "https://github.com" },
      { name: "语雀",    desc: "文档笔记", url: "https://www.yuque.com" },
      { name: "微博",    desc: "热搜",     url: "https://weibo.com" }
    ]
  },
  {
    cat: "工具",
    items: [
      { name: "草料二维码", desc: "二维码生成",  url: "https://cli.im" },
      { name: "TinyPNG",  desc: "图片压缩",    url: "https://tinypng.com" },
      { name: "JSON 工具", desc: "格式化/校验", url: "https://www.json.cn" },
      { name: "正则测试",   desc: "Regex101",   url: "https://regex101.com" },
      { name: "PDF24",    desc: "PDF 处理",    url: "https://tools.pdf24.org/zh/" },
      { name: "测速",      desc: "Speedtest",  url: "https://www.speedtest.cn" },
      { name: "临时邮箱",   desc: "收验证码",    url: "https://temp-mail.org/zh/" },
      { name: "时间戳",    desc: "Unix 转换",   url: "https://tool.lu/timestamp/" }
    ]
  },
  {
    cat: "学习",
    items: [
      { name: "MDN",             desc: "前端文档", url: "https://developer.mozilla.org/zh-CN/" },
      { name: "菜鸟教程",          desc: "入门教程", url: "https://www.runoob.com" },
      { name: "维基百科",          desc: "百科",    url: "https://zh.wikipedia.org" },
      { name: "稀土掘金",          desc: "技术社区", url: "https://juejin.cn" },
      { name: "Stack Overflow",  desc: "问答",    url: "https://stackoverflow.com" }
    ]
  }
];

/* =========================================================
   安全处理 localStorage
   ========================================================= */
const storage = {
  get(key) {
    try { return localStorage.getItem(key); }
    catch (e) { return null; }
  },
  set(key, val) {
    try { localStorage.setItem(key, val); }
    catch (e) { /* 忽略报错 */ }
  }
};

/* =========================================================
   渲染逻辑
   ========================================================= */
const board  = document.getElementById('board');
const search = document.getElementById('search');
const sub    = document.getElementById('sub');

const esc = s => String(s).replace(/[&<>"']/g, c => (
  { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
));

function hueOf(str){
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
  return h;
}

/* 判断是否是本地相对路径（非 http/https 等外部协议） */
const isLocal = url => !/^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(url);

/* 自动推断图标来源 */
function iconSources(it){
  // 1. 如果用户明确指定了本地或网络图片
  if (it.icon) return [it.icon];
  
  // 2. 如果是本地文件跳转，尝试匹配同名图片 (例如 ./MS_site/ms_site1.html -> ./MS_site/ms_site1.png)
  if (isLocal(it.url)) {
    const base = it.url.replace(/\.html?$/i, '');
    return [
      `${base}.png`,
      `${base}.ico`,
      `${base}.jpg`,
      `${base}.svg`
    ];
  }

  // 3. 外部网址，尝试抓取原生 favicon
  try{
    const u = new URL(it.url);
    const host = u.hostname;
    return [
      `https://favicon.im/${host}?larger=true`,
      `https://www.google.com/s2/favicons?sz=64&domain=${host}`,
      `${u.origin}/favicon.ico`
    ];
  }catch(e){
    return [];
  }
}

function fallbackTag(it){
  if (it.tag) return it.tag;
  const m = it.name.match(/[A-Za-z0-9]+/);
  if (m) return m[0].slice(0, 2).toUpperCase();
  return it.name.slice(0, 1);
}

function createIcon(it){
  const ico = document.createElement('span');
  ico.className = 'ico';
  ico.style.setProperty('--h', hueOf(it.name + it.url));

  const letter = document.createElement('span');
  letter.className = 'ico-letter';
  letter.textContent = fallbackTag(it);
  ico.appendChild(letter);

  const sources = iconSources(it);
  if (!sources.length) return ico;

  const img = document.createElement('img');
  img.alt = '';
  img.loading = 'lazy';
  img.decoding = 'async';
  img.referrerPolicy = 'no-referrer';

  let idx = 0;
  const next = () => {
    if (idx >= sources.length){ img.remove(); return; }
    img.src = sources[idx++];
  };

  img.addEventListener('load', () => ico.classList.add('has-img'));
  img.addEventListener('error', () => {
    if (idx < sources.length) next();
    else img.remove();
  });

  ico.appendChild(img);
  next();
  return ico;
}

function render(keyword = ''){
  const q = keyword.trim().toLowerCase();
  board.innerHTML = '';
  let total = 0;

  SITES.forEach(group => {
    const items = group.items.filter(it =>
      !q || (it.name + ' ' + (it.desc || '') + ' ' + it.url).toLowerCase().includes(q)
    );
    if (!items.length) return;
    total += items.length;

    const section = document.createElement('section');
    section.className = 'group';

    const head = document.createElement('div');
    head.className = 'group-head';
    head.innerHTML = `<span>${esc(group.cat)}</span><em>${items.length}</em>`;
    section.appendChild(head);

    const grid = document.createElement('div');
    grid.className = 'grid';

    items.forEach(it => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = it.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.title = it.name + (it.desc ? ' — ' + it.desc : '') + '\n' + it.url;
      a.style.setProperty('--h', hueOf(it.name + it.url));

      const local = isLocal(it.url);
      if (local) a.dataset.local = '1';

      a.appendChild(createIcon(it));

      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.innerHTML =
        `<b>${esc(it.name)}</b>
         <small>${esc(it.desc || (local ? it.url : ''))}</small>`;
      a.appendChild(meta);

      grid.appendChild(a);
    });

    section.appendChild(grid);
    board.appendChild(section);
  });

  if (total === 0){
    board.innerHTML = `<div class="empty">没有找到与 <b>${esc(q)}</b> 相关的站点</div>`;
  }

  const all = SITES.reduce((n, g) => n + g.items.length, 0);
  sub.textContent = q ? `搜索 “${q}” · ${total} 个结果` : `杂项网页 · 共 ${all} 个站点`;
}

/* 搜索防抖 */
let timer;
search.addEventListener('input', e => {
  clearTimeout(timer);
  const v = e.target.value;
  timer = setTimeout(() => render(v), 60);
});

/* 快捷键 */
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== search){
    e.preventDefault();
    search.focus();
    search.select();
  }
  if (e.key === 'Escape'){
    search.value = '';
    render('');
    search.blur();
  }
});

/* 浅色 / 深色切换 */
const themeBtn = document.getElementById('themeBtn');
const root = document.documentElement;

function applyTheme(t){
  root.dataset.theme = t;
  storage.set('theme', t);
}

const savedTheme = storage.get('theme');
const defaultTheme = savedTheme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
applyTheme(defaultTheme);

themeBtn.addEventListener('click', () => {
  applyTheme(root.dataset.theme === 'light' ? 'dark' : 'light');
});

/* 启动渲染 */
render();
</script>
</body>
</html>

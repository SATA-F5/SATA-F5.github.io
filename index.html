<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>守禄的win11</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* =========================================================
   浅色主题（默认）
   ========================================================= */
:root {
  color-scheme: light;

  --accent: #0067c0;
  --on-accent: #ffffff;

  --wallpaper-1: #a8d5f0;
  --wallpaper-2: #c1e0f5;
  --wallpaper-3: #e8f4fb;
  --wallpaper-base: #f0f6fa;

  --tb-bg: rgba(243, 243, 243, .86);
  --tb-text: #1a1a1a;
  --tb-hover: rgba(0, 0, 0, .05);
  --tb-active: rgba(0, 0, 0, .08);
  --tb-border: rgba(0, 0, 0, .06);
  --tb-shadow: 0 -2px 16px rgba(0, 0, 0, .1);

  --win-bg: rgba(249, 249, 249, .92);
  --win-text: #1a1a1a;
  --win-sub: #616161;
  --win-border: rgba(0, 0, 0, .08);
  --win-shadow: 0 24px 60px rgba(0, 0, 0, .18), 0 2px 6px rgba(0, 0, 0, .08);
  --win-shadow-focus: 0 32px 78px rgba(0, 0, 0, .24), 0 0 0 1px rgba(255, 255, 255, .55);

  --field-bg: rgba(255, 255, 255, .9);
  --field-border: rgba(0, 0, 0, .1);

  --flyout-bg: rgba(249, 249, 249, .93);
  --flyout-text: #1a1a1a;
  --flyout-sub: #616161;
  --flyout-border: rgba(0, 0, 0, .08);
  --flyout-hover: rgba(0, 0, 0, .05);
  --flyout-shadow: 0 16px 40px rgba(0, 0, 0, .18);

  --dicon-text: #1a1a1a;
  --dicon-text-shadow: 0 1px 2px rgba(255, 255, 255, .9), 0 0 10px rgba(255, 255, 255, .7);

  --frame-bg: #ffffff;
  --sidebar-bg: rgba(0, 0, 0, .022);

  --etab-bg: rgba(0, 0, 0, .05);
  --etab-hover: rgba(0, 0, 0, .07);
  --etab-active: #ffffff;
  --etab-active-text: #1a1a1a;
  --etab-shadow: 0 1px 3px rgba(0, 0, 0, .1);

  --ip-shadow: 8px 0 40px rgba(0, 0, 0, .16), 2px 0 10px rgba(0, 0, 0, .08);
  --ip-card-bg: rgba(255, 255, 255, .72);
  --ip-card-border: rgba(0, 0, 0, .06);

  --badge-bg: rgba(255, 255, 255, .95);
  --badge-border: rgba(0, 0, 0, .16);
  --badge-text: #1a1a1a;

  /* 图标色（不随主题变化） */
  --icon-blue-1: #5BB0F0;
  --icon-blue-2: #1E6FB8;
  --icon-folder: #f5b93c;
}

/* =========================================================
   深色主题（html.dark）—— 覆盖全部变量
   ========================================================= */
html.dark {
  color-scheme: dark;

  --accent: #4cc2ff;
  --on-accent: #002a45;

  --wallpaper-1: #1e4d7b;
  --wallpaper-2: #2d5a8c;
  --wallpaper-3: #0a2540;
  --wallpaper-base: #051020;

  --tb-bg: rgba(32, 32, 32, .86);
  --tb-text: #ffffff;
  --tb-hover: rgba(255, 255, 255, .06);
  --tb-active: rgba(255, 255, 255, .1);
  --tb-border: rgba(255, 255, 255, .06);
  --tb-shadow: 0 -2px 16px rgba(0, 0, 0, .4);

  --win-bg: rgba(32, 32, 32, .92);
  --win-text: #ffffff;
  --win-sub: #a8a8a8;
  --win-border: rgba(255, 255, 255, .09);
  --win-shadow: 0 24px 60px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
  --win-shadow-focus: 0 32px 78px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .12);

  --field-bg: rgba(255, 255, 255, .07);
  --field-border: rgba(255, 255, 255, .12);

  --flyout-bg: rgba(43, 43, 43, .95);
  --flyout-text: #ffffff;
  --flyout-sub: #a8a8a8;
  --flyout-border: rgba(255, 255, 255, .08);
  --flyout-hover: rgba(255, 255, 255, .06);
  --flyout-shadow: 0 16px 40px rgba(0, 0, 0, .55);

  --dicon-text: #ffffff;
  --dicon-text-shadow: 0 1px 3px rgba(0, 0, 0, .85), 0 0 10px rgba(0, 0, 0, .6);

  --frame-bg: #1e1e20;
  --sidebar-bg: rgba(255, 255, 255, .022);

  --etab-bg: rgba(0, 0, 0, .25);
  --etab-hover: rgba(255, 255, 255, .08);
  --etab-active: rgba(48, 48, 52, .95);
  --etab-active-text: #ffffff;
  --etab-shadow: 0 1px 3px rgba(0, 0, 0, .35);

  --ip-shadow: 8px 0 40px rgba(0, 0, 0, .55), 2px 0 10px rgba(0, 0, 0, .35);
  --ip-card-bg: rgba(255, 255, 255, .04);
  --ip-card-border: rgba(255, 255, 255, .07);

  --badge-bg: rgba(43, 43, 43, .95);
  --badge-border: rgba(255, 255, 255, .22);
  --badge-text: #ffffff;
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system,
               "Microsoft YaHei", "PingFang SC", sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  color: var(--win-text);
  background: var(--wallpaper-base);
  overscroll-behavior: none;
  transition: background .35s ease, color .35s ease;
}

body.dragging iframe { pointer-events: none; }

#desktop { position: fixed; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; }

/* ============ 壁纸 ============ */
#wallpaper {
  position: absolute; left: 0; top: 0; right: 0; bottom: 0;
  background: var(--wallpaper-base);
  overflow: hidden;
  z-index: 0;
  transition: background .35s ease;
}
#wallpaper::before {
  content: "";
  position: absolute;
  left: -20%; top: -20%; right: -20%; bottom: -20%;
  background:
    radial-gradient(circle at 25% 30%, var(--wallpaper-1) 0%, transparent 45%),
    radial-gradient(circle at 75% 70%, var(--wallpaper-2) 0%, transparent 45%),
    radial-gradient(circle at 50% 50%, var(--wallpaper-3) 0%, transparent 60%);
  filter: blur(80px) saturate(1.2);
  transition: background .35s ease;
}
#wallpaper::after {
  content: "";
  position: absolute; left: 0; top: 0; right: 0; bottom: 0;
  background: radial-gradient(125% 95% at 50% 42%, transparent 45%, rgba(0, 0, 0, .18));
  transition: background .35s ease;
}
html.dark #wallpaper::after {
  background: radial-gradient(125% 95% at 50% 42%, transparent 40%, rgba(0, 0, 0, .5));
}

/* ============ 桌面图标层 ============ */
#icon-layer {
  position: absolute;
  left: 8px; top: 8px; right: 8px; bottom: 56px;
  display: grid;
  grid-auto-flow: column;
  grid-template-rows: repeat(auto-fill, 100px);
  grid-auto-columns: 96px;
  align-content: start;
  justify-content: start;
  gap: 0;
  overflow: hidden;
  z-index: 1;
}

.dicon {
  width: 96px;
  height: 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 6px 4px;
  border-radius: 5px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: background .12s, border-color .12s;
}
.dicon:hover {
  background: rgba(127, 127, 127, .16);
  border-color: rgba(127, 127, 127, .22);
}
.dicon:active {
  background: rgba(127, 127, 127, .28);
  border-color: rgba(127, 127, 127, .45);
}

.dicon-glyph {
  width: 44px; height: 44px;
  flex-shrink: 0;
  display: grid; place-items: center;
  border-radius: 8px;
  color: #fff;
  overflow: hidden;
}
.dicon-glyph svg { display: block; }
.dicon-glyph.edge { background: linear-gradient(145deg, #0F82D8 0%, #23B8A6 55%, #7BE49B 100%); box-shadow: 0 4px 12px rgba(0, 0, 0, .28); }
.dicon-glyph.thispc { background: linear-gradient(145deg, var(--icon-blue-1) 0%, var(--icon-blue-2) 100%); box-shadow: 0 4px 12px rgba(0, 0, 0, .28); }
.dicon-glyph.plain {
  background: transparent;
  box-shadow: none;
}
.dicon-glyph.plain img {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
  filter: drop-shadow(0 3px 8px rgba(0, 0, 0, .35));
}

.dicon-label {
  max-width: 92px;
  font-size: 11.5px;
  line-height: 1.25;
  color: var(--dicon-text);
  text-align: center;
  text-shadow: var(--dicon-text-shadow);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  word-break: break-word;
  transition: color .35s ease, text-shadow .35s ease;
}

/* ============ 窗口层 ============ */
#windows {
  position: absolute;
  left: 0; top: 0; right: 0; bottom: 48px;
  pointer-events: none;
  z-index: 2;
}

.window {
  position: absolute;
  left: 0; top: 0;
  transform: translate3d(0, 0, 0);
  display: flex;
  flex-direction: column;
  min-width: 300px;
  min-height: 200px;
  border-radius: 8px;
  background: var(--win-bg);
  color: var(--win-text);
  border: 1px solid var(--win-border);
  box-shadow: var(--win-shadow);
  overflow: hidden;
  backdrop-filter: blur(30px) saturate(170%);
  -webkit-backdrop-filter: blur(30px) saturate(170%);
  pointer-events: auto;
  transition: box-shadow .15s ease, background .35s ease,
              color .35s ease, border-color .35s ease;
}
.window.focused { box-shadow: var(--win-shadow-focus); }
.window.dragging,
.window.resizing {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  box-shadow: none !important;
  transition: none !important;
}
.window.dragging { will-change: transform; }
.window.resizing { will-change: width, height; }

.window.maximized {
  transform: none !important;
  width: 100% !important;
  height: 100% !important;
  border-radius: 0;
  border: none;
}
.window.minimized { opacity: 0; pointer-events: none; }
.window.closing {
  opacity: 0;
  transform: scale(.96) translateY(6px);
  pointer-events: none;
  transition: opacity .13s ease, transform .13s ease;
}
.window.opening { animation: winFade .15s ease-out; }
@keyframes winFade { from { opacity: 0; } }

.titlebar {
  height: 34px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-left: 10px;
  cursor: default;
  touch-action: none;
}
.tb-app { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tb-app-icon {
  width: 16px; height: 16px;
  flex-shrink: 0;
  display: grid; place-items: center;
  border-radius: 3px;
  color: #fff;
  background: linear-gradient(145deg, var(--c, #4a7bff), color-mix(in srgb, var(--c, #4a7bff) 62%, #000));
  overflow: hidden;
}
.tb-app-icon.edge { background: linear-gradient(145deg, #0F82D8, #23B8A6); }
.tb-app-icon.thispc { background: linear-gradient(145deg, var(--icon-blue-1), var(--icon-blue-2)); }
.tb-app-icon.plain { background: transparent; }
.tb-app-icon.plain img {
  width: 100%; height: 100%;
  object-fit: contain; display: block;
  border-radius: 3px;
}
.tb-title {
  font-size: 12px;
  font-weight: 400;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tb-actions { display: flex; height: 100%; }

.wbtn {
  width: 46px;
  height: 100%;
  display: grid;
  place-items: center;
  border: none;
  background: transparent;
  color: inherit;
  cursor: pointer;
  transition: background .12s, color .12s;
}
.wbtn:hover { background: var(--tb-hover); }
.wbtn.close:hover { background: #c42b1c; color: #fff; }

.resize-handle {
  position: absolute; right: 0; bottom: 0;
  width: 20px; height: 20px;
  cursor: nwse-resize;
  z-index: 6;
  touch-action: none;
}
body.mobile .resize-handle { width: 32px; height: 32px; }

/* =========================================================
   Edge 浏览器
   ========================================================= */
.edge-page {
  flex: 1; display: flex; flex-direction: column; min-height: 0;
  background: var(--win-bg); color: var(--win-text);
  transition: background .35s, color .35s;
}

.edge-tabbar {
  height: 42px; flex-shrink: 0;
  display: flex; align-items: center; gap: 4px;
  padding: 5px 8px;
  background: var(--etab-bg);
  border-bottom: 1px solid var(--win-border);
  transition: background .35s, border-color .35s;
}
.edge-tabs {
  display: flex; gap: 3px; align-items: center;
  min-width: 0;
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none;
  flex: 1;
}
.edge-tabs::-webkit-scrollbar { display: none; }

.edge-tab {
  position: relative;
  height: 32px;
  min-width: 128px; max-width: 210px;
  flex-shrink: 0;
  display: flex; align-items: center; gap: 8px;
  padding: 0 6px 0 12px;
  border-radius: 7px;
  font-size: 12px;
  color: var(--win-text);
  cursor: pointer;
  transition: background .13s, color .13s, box-shadow .13s;
}
.edge-tab:hover { background: var(--etab-hover); }
.edge-tab.active {
  background: var(--etab-active);
  color: var(--etab-active-text);
  box-shadow: var(--etab-shadow);
}
.edge-tab-favicon {
  width: 14px; height: 14px;
  flex-shrink: 0;
  display: grid; place-items: center;
  border-radius: 3px;
  color: var(--win-sub);
  overflow: hidden;
}
.edge-tab.active .edge-tab-favicon { color: var(--accent); }
.edge-tab-title {
  flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.edge-tab.active .edge-tab-title { font-weight: 500; }
.edge-tab-close {
  width: 18px; height: 18px;
  flex-shrink: 0;
  display: grid; place-items: center;
  border: none; background: transparent;
  border-radius: 4px;
  color: inherit; cursor: pointer;
  opacity: .6;
  transition: background .12s, opacity .12s;
}
.edge-tab-close:hover { background: var(--tb-active); opacity: 1; }

.edge-newtab {
  width: 30px; height: 30px;
  flex-shrink: 0;
  display: grid; place-items: center;
  border: none; background: transparent;
  border-radius: 6px;
  color: inherit; cursor: pointer;
  transition: background .12s;
}
.edge-newtab:hover { background: var(--etab-hover); }

.edge-toolbar {
  height: 46px; flex-shrink: 0;
  display: flex; align-items: center; gap: 3px;
  padding: 0 10px;
  border-bottom: 1px solid var(--win-border);
  transition: border-color .35s;
}
.edge-btn {
  width: 32px; height: 32px; flex-shrink: 0;
  display: grid; place-items: center;
  border: none; border-radius: 6px;
  background: transparent; color: inherit;
  cursor: pointer;
  transition: background .12s, opacity .12s;
}
.edge-btn:hover:not(:disabled) { background: var(--tb-hover); }
.edge-btn:active:not(:disabled) { background: var(--tb-active); }
.edge-btn:disabled { opacity: .3; cursor: default; pointer-events: none; }
.edge-btn svg { display: block; }

.edge-address {
  flex: 1; min-width: 0; height: 32px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 14px; border-radius: 16px;
  background: var(--field-bg);
  border: 1px solid var(--field-border);
  font-size: 12.5px;
  margin: 0 5px;
  transition: border-color .15s, box-shadow .15s, background .35s;
}
.edge-address:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
.edge-address .lock { display: grid; place-items: center; opacity: .6; flex-shrink: 0; }
.edge-addr-input {
  flex: 1; min-width: 0;
  border: none; outline: none; background: transparent;
  font-family: inherit; font-size: 12.5px; color: inherit;
}
.edge-addr-input::placeholder { color: var(--win-sub); }

.edge-body {
  flex: 1; position: relative;
  min-height: 0;
  overflow: hidden;
  background: var(--frame-bg);
  transition: background .35s;
}
.edge-frame {
  position: absolute; left: 0; top: 0; right: 0; bottom: 0;
  width: 100%; height: 100%;
  border: none;
  background: var(--frame-bg);
  display: none;
}
.edge-frame.active { display: block; }

.edge-start {
  position: absolute; left: 0; top: 0; right: 0; bottom: 0;
  overflow-y: auto;
  display: flex; flex-direction: column; align-items: center;
  padding: 50px 24px 30px;
  background:
    radial-gradient(55% 45% at 50% 22%, rgba(15, 130, 216, .08), transparent 70%),
    radial-gradient(50% 40% at 70% 90%, rgba(35, 184, 166, .06), transparent 70%),
    var(--win-bg);
  transition: background .35s;
}
html.dark .edge-start {
  background:
    radial-gradient(55% 45% at 50% 22%, rgba(35, 184, 166, .1), transparent 70%),
    radial-gradient(50% 40% at 70% 90%, rgba(15, 130, 216, .09), transparent 70%),
    var(--win-bg);
}
.edge-start[hidden] { display: none; }

.edge-brand { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
.edge-brand-badge {
  width: 48px; height: 48px;
  display: grid; place-items: center;
  border-radius: 12px;
  background: linear-gradient(145deg, #0F82D8, #23B8A6);
}
.edge-brand-name {
  font-size: 22px; font-weight: 600; letter-spacing: .2px;
  color: var(--win-text);
}

.edge-searchbox {
  width: min(540px, 92%); height: 44px;
  display: flex; align-items: center; gap: 11px;
  padding: 0 18px; border-radius: 22px;
  background: var(--field-bg);
  border: 1px solid var(--field-border);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
  transition: border-color .15s, box-shadow .15s, background .35s;
}
.edge-searchbox:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
.edge-searchbox .s-ico { display: grid; place-items: center; opacity: .6; flex-shrink: 0; }
.edge-search-input {
  flex: 1; min-width: 0;
  border: none; outline: none; background: transparent;
  font-family: inherit; font-size: 14px; color: inherit;
}
.edge-search-input::placeholder { color: var(--win-sub); }

.edge-tiles {
  margin-top: 34px;
  display: grid; grid-template-columns: repeat(4, 92px);
  gap: 10px; justify-content: center;
}
.edge-tile {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 12px 6px; border-radius: 8px;
  cursor: pointer;
  transition: background .13s;
}
.edge-tile:hover { background: var(--tb-hover); }
.edge-tile-icon {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 8px; color: #fff;
  font-size: 14px; font-weight: 700;
  box-shadow: 0 3px 10px rgba(0, 0, 0, .22);
}
.edge-tile-name {
  font-size: 11.5px; max-width: 80px; text-align: center;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--win-text);
}

/* =========================================================
   此电脑
   ========================================================= */
.explorer {
  flex: 1; display: flex; flex-direction: column; min-height: 0;
  background: var(--win-bg); color: var(--win-text);
  font-size: 12.5px;
  transition: background .35s, color .35s;
}
.exp-toolbar {
  height: 42px; flex-shrink: 0;
  display: flex; align-items: center; gap: 3px;
  padding: 0 10px;
  border-bottom: 1px solid var(--win-border);
}
.exp-nav {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border: none; border-radius: 5px;
  background: transparent; color: inherit;
  cursor: pointer; opacity: .85;
  transition: background .12s;
}
.exp-nav:hover { background: var(--tb-hover); opacity: 1; }
.exp-nav.dim { opacity: .32; pointer-events: none; }

.exp-address {
  flex: 1; min-width: 0; height: 30px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 11px; border-radius: 5px;
  background: var(--field-bg);
  border: 1px solid var(--field-border);
  font-size: 12.5px;
}
.exp-address .crumb { opacity: .85; }

.exp-search {
  width: 180px; height: 30px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 11px; border-radius: 5px;
  background: var(--field-bg);
  border: 1px solid var(--field-border);
  font-size: 12px; color: var(--win-sub);
}

.exp-body { flex: 1; display: flex; min-height: 0; }
.exp-sidebar {
  width: 190px; flex-shrink: 0;
  padding: 8px 6px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--win-border);
  overflow-y: auto;
}
.exp-side-item {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 10px; border-radius: 5px;
  cursor: default;
  transition: background .12s;
}
.exp-side-item:hover { background: var(--tb-hover); }
.exp-side-item.active { background: var(--tb-active); }
.exp-side-item .si {
  width: 16px; display: grid; place-items: center;
  flex-shrink: 0; opacity: .9;
}
.exp-side-item .si.gold  { color: #d9a53b; }
.exp-side-item .si.blue  { color: #3b82f6; }
.exp-side-item .si.green { color: #10b981; }
.exp-side-item .si.pink  { color: #ec4899; }
.exp-side-item .si.purple{ color: #a855f7; }
.exp-side-item .si.red   { color: #ef4444; }
.exp-side-item .si.gray  { color: #8a8a8a; }
html.dark .exp-side-item .si.blue { color: #60a5fa; }
html.dark .exp-side-item .si.green{ color: #34d399; }
html.dark .exp-side-item .si.gold { color: #fbbf24; }
html.dark .exp-side-item .si.pink { color: #f472b6; }
html.dark .exp-side-item .si.purple{color: #c084fc; }
html.dark .exp-side-item .si.red  { color: #f87171; }
html.dark .exp-side-item .si.gray { color: #9ca3af; }

.exp-divider { height: 1px; margin: 7px 10px; background: var(--field-border); }
.exp-main { flex: 1; min-width: 0; overflow-y: auto; padding: 16px 20px 24px; }
.exp-group-title { font-size: 12.5px; font-weight: 600; margin-bottom: 10px; }
.exp-group + .exp-group { margin-top: 24px; }
.exp-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 4px;
}
.drive {
  display: flex; align-items: center; gap: 13px;
  padding: 11px 12px; border-radius: 7px;
  cursor: default;
  transition: background .13s;
}
.drive:hover { background: var(--tb-hover); }
.drive-icon {
  width: 42px; height: 42px; flex-shrink: 0;
  display: grid; place-items: center; border-radius: 8px;
  background: linear-gradient(145deg, var(--icon-blue-1), var(--icon-blue-2));
  color: #fff; box-shadow: 0 3px 10px rgba(0, 0, 0, .22);
}
.drive-info { flex: 1; min-width: 0; }
.drive-name {
  font-size: 12.5px; font-weight: 500; margin-bottom: 5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.drive-bar {
  height: 5px; border-radius: 3px;
  background: var(--field-border); overflow: hidden; margin-bottom: 5px;
}
.drive-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, #0ea5e9, #3b82f6);
}
.drive-meta { font-size: 11px; color: var(--win-sub); }

.folder {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; border-radius: 7px;
  cursor: default;
  transition: background .13s;
}
.folder:hover { background: var(--tb-hover); }
.folder-icon {
  width: 34px; height: 34px; flex-shrink: 0;
  display: grid; place-items: center; border-radius: 6px;
  color: var(--icon-folder);
  background: rgba(245, 185, 60, .16);
}
.folder-name {
  font-size: 12.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* =========================================================
   任务栏
   ========================================================= */
#taskbar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 48px;
  display: flex;
  align-items: center;
  padding: 0 8px;
  background: var(--tb-bg);
  color: var(--tb-text);
  border-top: 1px solid var(--tb-border);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  box-shadow: var(--tb-shadow);
  z-index: 500;
  transition: background .35s, color .35s, border-color .35s, box-shadow .35s;
}

#startBtn {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: none;
  border-radius: 5px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  transition: background .12s;
}
#startBtn:hover { background: var(--tb-hover); }
#startBtn:active { background: var(--tb-active); transform: translate(-50%, -50%) scale(.94); }

#tray {
  position: absolute;
  right: 6px;
  top: 0; bottom: 0;
  display: flex;
  align-items: center;
  gap: 2px;
  font-size: 11.5px;
}
#tray .tray-btn {
  height: 36px;
  min-width: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 8px;
  border: none;
  background: transparent;
  color: inherit;
  cursor: pointer;
  border-radius: 5px;
  transition: background .12s;
  position: relative;
}
#tray .tray-btn:hover { background: var(--tb-hover); }
#tray .tray-icons {
  display: flex; align-items: center; gap: 8px;
}
#tray .tray-icons svg { display: block; }

.tray-icon-wrap {
  position: relative;
  display: inline-grid;
  place-items: center;
  width: 20px;
  height: 20px;
}
.tray-icon-wrap svg { display: block; }

.tray-badge {
  position: absolute;
  right: -9px;
  bottom: -6px;
  min-width: 15px;
  height: 15px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--badge-bg);
  border: 1.5px solid var(--badge-border);
  color: var(--badge-text);
  font-size: 9.5px;
  font-weight: 600;
  line-height: 1;
  display: grid;
  place-items: center;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .18);
  transition: opacity .2s ease, transform .2s ease;
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.tray-badge.hidden {
  opacity: 0;
  transform: scale(.6);
}

#clock {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  padding: 0 10px;
  height: 36px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 11.5px;
  line-height: 1.35;
  transition: background .12s;
}
#clock:hover { background: var(--tb-hover); }
#clock .t { font-size: 12px; }
#clock .d { font-size: 11px; opacity: .88; }

/* =========================================================
   信息栏
   ========================================================= */
#infoPanel {
  position: absolute;
  left: 0;
  top: 50%;
  width: 296px;
  max-width: calc(100vw - 20px);
  max-height: min(520px, calc(100vh - 80px));
  z-index: 550;
  display: flex;
  flex-direction: column;
  background: var(--flyout-bg);
  color: var(--flyout-text);
  border: 1px solid var(--flyout-border);
  border-left: none;
  border-radius: 0 10px 10px 0;
  box-shadow: var(--ip-shadow);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  transform: translate(-100%, -50%);
  opacity: 0;
  pointer-events: none;
  transition:
    transform .4s cubic-bezier(.2, .9, .25, 1.05),
    opacity .25s ease .05s,
    background .35s, color .35s;
}
#infoPanel.open {
  transform: translate(0, -50%);
  opacity: 1;
  pointer-events: auto;
}

#infoTrigger {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 48px;
  width: 8px;
  z-index: 400;
}
body.info-open #infoTrigger { pointer-events: none; }

.ip-header {
  flex-shrink: 0;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px 0 14px;
  border-bottom: 1px solid var(--flyout-border);
}
.ip-title {
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: .2px;
}
.ip-actions { display: flex; gap: 2px; }
.ip-act-btn {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border: none;
  background: transparent;
  color: inherit;
  border-radius: 5px;
  cursor: pointer;
  transition: background .12s;
}
.ip-act-btn:hover { background: var(--flyout-hover); }
.ip-act-btn svg { display: block; }

.ip-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ip-body::-webkit-scrollbar { width: 5px; }
.ip-body::-webkit-scrollbar-thumb {
  background: rgba(127, 127, 127, .28);
  border-radius: 3px;
}

.ip-card {
  background: var(--ip-card-bg);
  border: 1px solid var(--ip-card-border);
  border-radius: 7px;
  padding: 10px 11px;
  transition: background .35s, border-color .35s;
}
.ip-card-title {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11.5px;
  font-weight: 600;
  margin-bottom: 8px;
  color: var(--flyout-text);
}
.ip-card-title .ip-card-sub {
  font-size: 10.5px;
  font-weight: 400;
  color: var(--flyout-sub);
}

.ip-weather {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 11px;
  background: linear-gradient(135deg,
              color-mix(in srgb, var(--accent) 20%, var(--ip-card-bg)),
              var(--ip-card-bg));
  border-color: color-mix(in srgb, var(--accent) 25%, transparent);
}
.ip-weather-icon {
  width: 38px; height: 38px;
  flex-shrink: 0;
  display: grid; place-items: center;
  color: #fbbf24;
}
.ip-weather-icon svg { width: 30px; height: 30px; }
.ip-weather-main { flex: 1; min-width: 0; }
.ip-weather-temp {
  font-size: 22px;
  font-weight: 300;
  line-height: 1;
  letter-spacing: -.3px;
  margin-bottom: 2px;
}
.ip-weather-loc {
  font-size: 11px;
  color: var(--flyout-sub);
}
.ip-weather-extra {
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-size: 10px;
  color: var(--flyout-sub);
  text-align: right;
}

.ip-stat {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10.5px;
  padding: 3px 0;
}
.ip-stat + .ip-stat { margin-top: 1px; }
.ip-stat-label {
  width: 32px;
  flex-shrink: 0;
  color: var(--flyout-sub);
}
.ip-stat-bar {
  flex: 1;
  height: 5px;
  border-radius: 3px;
  background: var(--field-border);
  overflow: hidden;
}
.ip-stat-fill {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #fff));
  transition: width .4s ease;
}
.ip-stat-val {
  width: 30px;
  text-align: right;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
  color: var(--flyout-sub);
}

.ip-shortcuts {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2px;
}
.ip-shortcut {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 7px 2px;
  border-radius: 5px;
  cursor: pointer;
  transition: background .13s;
}
.ip-shortcut:hover { background: var(--flyout-hover); }
.ip-shortcut-icon {
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border-radius: 6px;
  color: #fff;
  background: linear-gradient(145deg, var(--c, #4a7bff), color-mix(in srgb, var(--c, #4a7bff) 62%, #000));
  overflow: hidden;
}
.ip-shortcut-icon.edge { background: linear-gradient(145deg, #0F82D8, #23B8A6); }
.ip-shortcut-icon.thispc { background: linear-gradient(145deg, var(--icon-blue-1), var(--icon-blue-2)); }
.ip-shortcut-icon.plain { background: transparent; }
.ip-shortcut-icon.plain img {
  width: 100%; height: 100%;
  object-fit: contain; display: block;
  border-radius: 6px;
  filter: drop-shadow(0 2px 5px rgba(0, 0, 0, .35));
}
.ip-shortcut-name {
  font-size: 10px;
  text-align: center;
  max-width: 60px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--flyout-text);
}

.ip-windows {
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.ip-window-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 5px;
  cursor: pointer;
  transition: background .12s;
  font-size: 11.5px;
}
.ip-window-item:hover { background: var(--flyout-hover); }
.ip-window-item.active {
  background: color-mix(in srgb, var(--accent) 15%, transparent);
}
.ip-window-icon {
  width: 18px; height: 18px;
  flex-shrink: 0;
  display: grid; place-items: center;
  border-radius: 4px;
  color: #fff;
  background: linear-gradient(145deg, var(--c, #4a7bff), color-mix(in srgb, var(--c, #4a7bff) 62%, #000));
  overflow: hidden;
}
.ip-window-icon.edge { background: linear-gradient(145deg, #0F82D8, #23B8A6); }
.ip-window-icon.thispc { background: linear-gradient(145deg, var(--icon-blue-1), var(--icon-blue-2)); }
.ip-window-icon.plain { background: transparent; }
.ip-window-icon.plain img {
  width: 100%; height: 100%;
  object-fit: contain; display: block;
  border-radius: 4px;
}
.ip-window-name {
  flex: 1; min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ip-empty {
  padding: 12px;
  text-align: center;
  font-size: 10.5px;
  color: var(--flyout-sub);
  opacity: .7;
}

/* =========================================================
   开始菜单
   ========================================================= */
#startMenu {
  position: absolute;
  left: 50%; bottom: 58px;
  width: 640px;
  max-width: calc(100vw - 20px);
  height: 640px;
  max-height: calc(100vh - 90px);
  display: flex; flex-direction: column;
  padding: 32px 40px 0;
  border-radius: 8px;
  background: var(--flyout-bg);
  color: var(--flyout-text);
  border: 1px solid var(--flyout-border);
  box-shadow: var(--flyout-shadow);
  backdrop-filter: blur(50px) saturate(180%);
  -webkit-backdrop-filter: blur(50px) saturate(180%);
  z-index: 600;
  opacity: 0; pointer-events: none;
  transform: translateX(-50%) translateY(20px) scale(.98);
  transition: opacity .18s ease, transform .24s cubic-bezier(.2, .9, .3, 1.05),
              background .35s, color .35s;
}
#startMenu.open {
  opacity: 1; pointer-events: auto;
  transform: translateX(-50%) translateY(0) scale(1);
}

.sm-search {
  height: 34px;
  flex-shrink: 0;
  display: flex; align-items: center; gap: 10px;
  padding: 0 14px;
  margin-bottom: 28px;
  border-radius: 17px;
  background: var(--field-bg);
  border: 1px solid var(--field-border);
  transition: border-color .15s, box-shadow .15s, background .35s;
}
.sm-search:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
.sm-search .ico { display: grid; place-items: center; opacity: .7; flex-shrink: 0; }
.sm-search input {
  flex: 1; min-width: 0;
  border: none; outline: none; background: transparent;
  font-family: inherit; font-size: 13px; color: inherit;
}
.sm-search input::placeholder { color: var(--flyout-sub); }

.sm-section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
  flex-shrink: 0;
}
.sm-section-title {
  font-size: 13px;
  font-weight: 600;
}
.sm-more-btn {
  display: flex; align-items: center; gap: 4px;
  padding: 5px 10px;
  border: none;
  background: transparent;
  color: inherit;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  transition: background .12s;
}
.sm-more-btn:hover { background: var(--flyout-hover); }

#startGrid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 0;
  flex-shrink: 0;
  margin-bottom: 12px;
}

.start-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px;
  padding: 12px 4px;
  border-radius: 5px;
  cursor: pointer;
  transition: background .12s;
}
.start-item:hover { background: var(--flyout-hover); }
.start-item .si-icon {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: 6px; color: #fff;
  background: linear-gradient(145deg, var(--c, #4a7bff), color-mix(in srgb, var(--c, #4a7bff) 62%, #000));
  overflow: hidden;
}
.start-item .si-icon.edge { background: linear-gradient(145deg, #0F82D8, #23B8A6); }
.start-item .si-icon.thispc { background: linear-gradient(145deg, var(--icon-blue-1), var(--icon-blue-2)); }
.start-item .si-icon.plain { background: transparent; }
.start-item .si-icon.plain img {
  width: 100%; height: 100%;
  object-fit: contain; display: block;
  border-radius: 6px;
  filter: drop-shadow(0 2px 5px rgba(0, 0, 0, .35));
}
.start-item .si-name {
  font-size: 11.5px;
  text-align: center;
  line-height: 1.3;
  max-width: 84px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.sm-recommend {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding-bottom: 12px;
}
.sm-recommend::-webkit-scrollbar { width: 8px; }
.sm-recommend::-webkit-scrollbar-thumb {
  background: rgba(127, 127, 127, .3);
  border-radius: 4px;
}

.rec-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 10px;
  border-radius: 5px;
  cursor: pointer;
  transition: background .12s;
}
.rec-item:hover { background: var(--flyout-hover); }
.rec-icon {
  width: 32px; height: 32px;
  flex-shrink: 0;
  display: grid; place-items: center;
  border-radius: 6px;
  color: #fff;
  background: linear-gradient(145deg, var(--c, #4a7bff), color-mix(in srgb, var(--c, #4a7bff) 62%, #000));
  overflow: hidden;
}
.rec-icon.plain { background: transparent; }
.rec-icon.plain img {
  width: 100%; height: 100%;
  object-fit: contain; display: block;
  border-radius: 6px;
}
.rec-icon.edge { background: linear-gradient(145deg, #0F82D8, #23B8A6); }
.rec-icon.thispc { background: linear-gradient(145deg, var(--icon-blue-1), var(--icon-blue-2)); }
.rec-info { flex: 1; min-width: 0; }
.rec-name {
  font-size: 12px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rec-sub {
  font-size: 11px;
  color: var(--flyout-sub);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-top: 2px;
}

.sm-footer {
  flex-shrink: 0;
  height: 56px;
  margin: 0 -40px;
  padding: 0 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--flyout-border);
  background: rgba(0, 0, 0, .02);
  border-radius: 0 0 8px 8px;
}
html.dark .sm-footer { background: rgba(255, 255, 255, .02); }

.sm-user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px;
  border-radius: 5px;
  cursor: pointer;
  transition: background .12s;
}
.sm-user:hover { background: var(--flyout-hover); }
.sm-avatar {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: 50%;
  color: #fff;
  background: linear-gradient(145deg, #6ea8fe, #3b5bdb);
  font-size: 13px;
}
.sm-username { font-size: 13px; }

.sm-power {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border: none;
  background: transparent;
  color: inherit;
  border-radius: 5px;
  cursor: pointer;
  transition: background .12s;
}
.sm-power:hover { background: var(--flyout-hover); }

/* =========================================================
   快速设置面板
   ========================================================= */
#quickPanel {
  position: absolute;
  right: 12px; bottom: 58px;
  width: 360px;
  max-width: calc(100vw - 20px);
  display: flex;
  flex-direction: column;
  padding: 20px;
  border-radius: 8px;
  background: var(--flyout-bg);
  color: var(--flyout-text);
  border: 1px solid var(--flyout-border);
  box-shadow: var(--flyout-shadow);
  backdrop-filter: blur(50px) saturate(180%);
  -webkit-backdrop-filter: blur(50px) saturate(180%);
  z-index: 610;
  opacity: 0; pointer-events: none;
  transform: translateY(16px) scale(.98);
  transition: opacity .18s ease, transform .22s cubic-bezier(.2, .9, .3, 1.05),
              background .35s, color .35s;
}
#quickPanel.open {
  opacity: 1; pointer-events: auto;
  transform: translateY(0) scale(1);
}

.qp-tiles {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}
.qp-tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 16px 8px;
  border-radius: 6px;
  background: var(--field-bg);
  border: 1px solid var(--field-border);
  cursor: pointer;
  transition: background .13s, border-color .13s;
  font-size: 11.5px;
}
.qp-tile:hover { background: var(--flyout-hover); }
.qp-tile.active {
  background: var(--accent);
  color: var(--on-accent);
  border-color: transparent;
}
.qp-tile.active .qp-tile-icon { color: var(--on-accent); }
.qp-tile-icon {
  width: 20px; height: 20px;
  display: grid; place-items: center;
  color: var(--accent);
  transition: color .13s;
}
.qp-slider-group { margin-bottom: 16px; }
.qp-slider-group:last-child { margin-bottom: 0; }
.qp-slider-label {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 8px;
  font-size: 12px;
}
.qp-slider-label .ico { opacity: .7; }
.qp-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  border-radius: 2px;
  background: var(--field-border);
  outline: none;
}
.qp-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid var(--flyout-bg);
  box-shadow: 0 0 0 1px var(--field-border);
  cursor: pointer;
}
.qp-slider::-moz-range-thumb {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid var(--flyout-bg);
  cursor: pointer;
}

/* =========================================================
   日历面板
   ========================================================= */
#calendarPanel {
  position: absolute;
  right: 12px; bottom: 58px;
  width: 360px;
  max-width: calc(100vw - 20px);
  padding: 20px;
  border-radius: 8px;
  background: var(--flyout-bg);
  color: var(--flyout-text);
  border: 1px solid var(--flyout-border);
  box-shadow: var(--flyout-shadow);
  backdrop-filter: blur(50px) saturate(180%);
  -webkit-backdrop-filter: blur(50px) saturate(180%);
  z-index: 610;
  opacity: 0; pointer-events: none;
  transform: translateY(16px) scale(.98);
  transition: opacity .18s ease, transform .22s cubic-bezier(.2, .9, .3, 1.05),
              background .35s, color .35s;
}
#calendarPanel.open {
  opacity: 1; pointer-events: auto;
  transform: translateY(0) scale(1);
}

.cal-header { margin-bottom: 16px; }
.cal-big-date {
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 4px;
}
.cal-weekday { font-size: 12.5px; color: var(--flyout-sub); }

.cal-month-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
  font-size: 13px;
  font-weight: 500;
}
.cal-nav-btn {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border: none; background: transparent;
  color: inherit;
  border-radius: 5px;
  cursor: pointer;
  transition: background .12s;
}
.cal-nav-btn:hover { background: var(--flyout-hover); }

.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  margin-bottom: 6px;
  font-size: 11px;
  color: var(--flyout-sub);
  text-align: center;
}
.cal-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.cal-day {
  aspect-ratio: 1;
  display: grid; place-items: center;
  border-radius: 50%;
  font-size: 12px;
  cursor: pointer;
  transition: background .12s;
}
.cal-day:hover { background: var(--flyout-hover); }
.cal-day.other { opacity: .35; }
.cal-day.today {
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 600;
}

/* =========================================================
   右键菜单
   ========================================================= */
#ctxMenu {
  position: absolute;
  min-width: 220px;
  padding: 5px;
  border-radius: 7px;
  background: var(--flyout-bg);
  color: var(--flyout-text);
  border: 1px solid var(--flyout-border);
  box-shadow: var(--flyout-shadow);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  z-index: 900;
  opacity: 0; pointer-events: none;
  transform: scale(.97);
  transform-origin: top left;
  transition: opacity .12s ease, transform .12s ease,
              background .35s, color .35s;
}
#ctxMenu.open { opacity: 1; pointer-events: auto; transform: scale(1); }

.ctx-item {
  display: flex; align-items: center; gap: 11px;
  padding: 8px 11px; border-radius: 4px;
  font-size: 12.5px; cursor: pointer;
  transition: background .1s;
}
.ctx-item:hover { background: var(--flyout-hover); }
.ctx-item.disabled { opacity: .55; pointer-events: none; }
.ctx-item .ci-icon { width: 16px; display: grid; place-items: center; opacity: .8; }
.ctx-sep { height: 1px; margin: 4px 8px; background: var(--flyout-border); }

/* ============ 提示条 ============ */
#toast {
  position: absolute;
  left: 50%; bottom: 70px;
  transform: translateX(-50%) translateY(16px);
  padding: 11px 20px;
  border-radius: 7px;
  background: var(--flyout-bg);
  color: var(--flyout-text);
  border: 1px solid var(--flyout-border);
  box-shadow: var(--flyout-shadow);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  font-size: 12.5px;
  z-index: 1000;
  opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .26s cubic-bezier(.2, .9, .3, 1.05),
              background .35s, color .35s;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* =========================================================
   移动端降级
   ========================================================= */
body.mobile #wallpaper::before { filter: blur(40px) saturate(1.15); }
body.mobile .window,
body.mobile #taskbar,
body.mobile #startMenu,
body.mobile #infoPanel,
body.mobile #quickPanel,
body.mobile #calendarPanel,
body.mobile #ctxMenu,

}

body.mobile .window.dragging,
body.mobile .window.resizing { box-shadow: none !important; }

@media (max-width: 720px) {

}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}

/* ================= 从本地 HTML 提取 <title> ================= */
async function extractLocalTitles() {
  const tasks = sites.map(async (s) => {
    if (s.type !== 'local' || !s.url) return;
    try {
      const res = await fetch(s.url, { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const doc  = new DOMParser().parseFromString(text, 'text/html');
      const title = (doc.querySelector('title')?.textContent || '').trim();
      if (title) s.name = title;
    } catch (err) {
      console.warn(`[导航] 无法读取 ${s.url} 的标题：`, err.message);
    }
  });
  await Promise.all(tasks);
}

function glyphHTML(s, size = 24, sw = 1.8) {
  if (s.type === 'edge')   return { html: EDGE_LOGO,      cls: 'edge'   };
  if (s.type === 'thispc') return { html: EXPLORER_SMALL, cls: 'thispc' };
  if (s.type === 'local')  return {
    html: `<img src="${s.icon}" alt="${s.name}">`,
    cls: 'plain'
  };
  if (isEmptySlot(s)) return { html: svgIcon('plus', 24, 2.2), cls: '' };
  return { html: svgIcon(s.icon, size, sw), cls: '' };
}

function smallGlyphHTML(s, size = 12, sw = 2.4) {
  if (s.type === 'edge')   return { html: svgIcon('globe', size, sw),   cls: 'edge'   };
  if (s.type === 'thispc') return { html: svgIcon('monitor', size, sw), cls: 'thispc' };
  if (s.type === 'local')  return {
    html: `<img src="${s.icon}" alt="">`,
    cls: 'plain'
  };
  return { html: svgIcon(s.icon || 'globe', size, sw), cls: '' };
}

function attachImgFallback(container, fallbackName = 'globe', size = 24, sw = 1.8) {
  const img = container.querySelector('img');
  if (!img) return;
  img.addEventListener('error', () => {
    container.classList.remove('plain');
    container.innerHTML = svgIcon(fallbackName, size, sw);
  }, { once: true });
}

  handle.addEventListener('pointerdown', e => startResize(e, w));
}

/* =========================================================
   链接拦截器
   ========================================================= */
function injectLinkInterceptor(iframe, openInNewTab) {
  try {
    const doc = iframe.contentDocument;
    const win = iframe.contentWindow;
    if (!doc || !win) return;
    if (doc.__edgeInjected) return;
    doc.__edgeInjected = true;

    const baseUrl = iframe.src || doc.baseURI || location.href;
    const normalize = (url) => {
      try { return new URL(url, baseUrl).href; }
      catch (_) { return url; }
    };
    const isHttp = (url) => /^https?:/i.test(url || '');

    if (!win.__edgeOpenPatched) {
      win.__edgeOpenPatched = true;
      const origOpen = win.open;
      win.open = function (url, target, features) {
        if (url && isHttp(normalize(url))) {
          openInNewTab(normalize(url), true);
          return null;
        }
        return origOpen.call(this, url, target, features);
      };
    }

    doc.addEventListener('click', function (e) {
      const a = e.target && e.target.closest && e.target.closest('a');
      if (!a || !a.hasAttribute('href')) return;
      const raw = a.getAttribute('href') || '';
      if (!raw || raw.startsWith('#') || raw.startsWith('javascript:')) return;
      if (!isHttp(a.href)) return;
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      openInNewTab(normalize(a.href), true);
    }, true);

    doc.addEventListener('click', function (e) {
      const area = e.target && e.target.closest && e.target.closest('area');
      if (!area || !isHttp(area.href)) return;
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      openInNewTab(normalize(area.href), true);
    }, true);

    try {
      const AProto = win.HTMLAnchorElement && win.HTMLAnchorElement.prototype;
      if (AProto && !AProto.__edgePatched) {
        AProto.__edgePatched = true;
        const origClick = AProto.click;
        AProto.click = function () {
          if (this.href && isHttp(this.href)) {
            openInNewTab(normalize(this.href), true);
            return;
          }
          return origClick.apply(this, arguments);
        };
      }
    } catch (_) {}

    doc.addEventListener('submit', function (e) {
      const form = e.target;
      if (!form || form.tagName !== 'FORM') return;
      if (form.target !== '_blank') return;
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      try {
        const action = form.action || baseUrl;
        const method = (form.method || 'get').toLowerCase();
        let url = action;
        if (method === 'get') {
          const params = new URLSearchParams(new FormData(form)).toString();
          if (params) url = action + (action.includes('?') ? '&' : '?') + params;
        }
        openInNewTab(normalize(url), true);
      } catch (_) {
        openInNewTab(normalize(form.action || baseUrl), true);
      }
    }, true);
  } catch (_) {}
}

/* =========================================================
   Edge 浏览器
   ========================================================= */
function createEdgeWin(site, initialUrl = null) {
  const bodyHTML = `
    <div class="edge-page">
      <div class="edge-tabbar">
        <div class="edge-tabs"></div>
        <button class="edge-newtab" title="新建标签页（Ctrl+T）">
          ${svgIcon('plus', 14, 2.2)}
        </button>
      </div>
      <div class="edge-toolbar">
        <button class="edge-btn" data-edge="back" title="后退" disabled>
          ${svgIcon('back', 16, 2)}
        </button>
        <button class="edge-btn" data-edge="forward" title="前进" disabled>
          ${svgIcon('forward', 16, 2)}
        </button>
        <button class="edge-btn" data-edge="reload" title="刷新">
          ${svgIcon('reload', 16, 2)}
        </button>
        <button class="edge-btn" data-edge="home" title="主页">
          ${svgIcon('home', 16, 2)}
        </button>
        <div class="edge-address">
          <span class="lock">${svgIcon('lock', 12, 2)}</span>
          <input class="edge-addr-input" type="text" placeholder="搜索或输入网址"
                 spellcheck="false" autocomplete="off">
        </div>
        <button class="edge-btn" data-edge="external" title="在新标签页打开">
          ${svgIcon('external', 16, 2)}
        </button>
      </div>
      <div class="edge-body">
        <div class="edge-start" data-edge-view="start">
          <div class="edge-brand">
            <span class="edge-brand-badge">${EDGE_LOGO}</span>
            <div class="edge-brand-name">Microsoft Edge</div>
          </div>
          <div class="edge-searchbox">
            <span class="s-ico">${svgIcon('search', 17, 2)}</span>
            <input class="edge-search-input" type="text" placeholder="搜索网页"
                   autocomplete="off" spellcheck="false">
          </div>
          <div class="edge-tiles"></div>
        </div>
      </div>
    </div>
  `;

  const w = buildWindow({
    site: { ...site, type: 'edge' },
    title: 'Microsoft Edge',
    color: '#0F82D8',
    bodyHTML,
  });

  const el = w.el;
  const tabsBar    = el.querySelector('.edge-tabs');
  const newTabBtn  = el.querySelector('.edge-newtab');
  const bodyEl     = el.querySelector('.edge-body');
  const startView  = el.querySelector('.edge-start');
  const addrInput  = el.querySelector('.edge-addr-input');
  const searchIn   = el.querySelector('.edge-search-input');
  const tilesEl    = el.querySelector('.edge-tiles');
  const backBtn    = el.querySelector('[data-edge="back"]');
  const forwardBtn = el.querySelector('[data-edge="forward"]');
  const reloadBtn  = el.querySelector('[data-edge="reload"]');
  const homeBtn    = el.querySelector('[data-edge="home"]');
  const externalBtn= el.querySelector('[data-edge="external"]');

  const tabs = [];
  let activeTabId = null;
  let tabSeq = 0;

  function normalizeUrl(v) {
    v = (v || '').trim();
    if (!v) return null;
    if (/^https?:\/\//i.test(v)) return v;
    if (/^[\w-]+(\.[\w-]+)+/.test(v)) return 'https://' + v;
    return 'https://www.bing.com/search?q=' + encodeURIComponent(v);
  }

  function extractHostname(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); }
    catch (_) { return url; }
  }

  function getActiveTab() {
    return tabs.find(t => t.id === activeTabId) || null;
  }

  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function updateTabBar() {
    tabsBar.replaceChildren();
    tabs.forEach(tab => {
      const tabEl = document.createElement('div');
      tabEl.className = 'edge-tab' + (tab.id === activeTabId ? ' active' : '');
      tabEl.dataset.tabId = tab.id;
      tabEl.title = tab.title;

      tabEl.innerHTML = `
        <span class="edge-tab-favicon">${svgIcon('globe', 12, 2.2)}</span>
        <span class="edge-tab-title">${escapeHTML(tab.title)}</span>
        <button class="edge-tab-close" title="关闭标签页">
          ${svgIcon('close', 10, 2.6)}
        </button>
      `;

      tabEl.addEventListener('click', e => {
        if (e.target.closest('.edge-tab-close')) {
          e.stopPropagation();
          closeTab(tab.id);
        } else {
          activateTab(tab.id);
        }
      });

      tabsBar.appendChild(tabEl);
      tab.tabEl = tabEl;
    });
  }

  function updateTabTitle(tab) {
    if (!tab.tabEl) return;
    const titleEl = tab.tabEl.querySelector('.edge-tab-title');
    if (titleEl) titleEl.textContent = tab.title;
    tab.tabEl.title = tab.title;
  }

  function openUrlInTab(url, activate = true) {
    if (!url) return;
    const exist = tabs.find(t => t.url === url);
    if (exist) {
      if (activate) activateTab(exist.id);
      return;
    }
    const tab = createTab();
    navigateInTab(tab, url, true);
    if (activate) activateTab(tab.id);
  }

  function createTab(initialUrl = null) {
    const id = 't' + (++tabSeq);

    const iframe = document.createElement('iframe');
    iframe.className = 'edge-frame';
    iframe.dataset.tabId = id;
    iframe.referrerPolicy = 'no-referrer';
    bodyEl.appendChild(iframe);

    const tab = {
      id,
      title: '新标签页',
      url: '',
      history: [],
      historyIndex: -1,
      iframe,
      tabEl: null,
    };

    iframe.addEventListener('load', () => {
      try {
        const innerTitle = iframe.contentDocument?.title?.trim();
        if (innerTitle && innerTitle !== tab.title) {
          tab.title = innerTitle;
          updateTabTitle(tab);
        }
      } catch (_) {}
      injectLinkInterceptor(iframe, openUrlInTab);
    });

    tabs.push(tab);
    updateTabBar();

    if (initialUrl) {
      navigateInTab(tab, initialUrl, true);
    } else {
      activateTab(id);
    }

    return tab;
  }

  function closeTab(id) {
    const idx = tabs.findIndex(t => t.id === id);
    if (idx < 0) return;
    const tab = tabs[idx];
    tab.iframe.remove();
    tabs.splice(idx, 1);

    if (tabs.length === 0) { createTab(); return; }

    if (activeTabId === id) {
      const next = tabs[Math.min(idx, tabs.length - 1)];
      activateTab(next.id);
    } else {
      updateTabBar();
    }
  }

  function activateTab(id) {
    const tab = tabs.find(t => t.id === id);
    if (!tab) return;
    activeTabId = id;

    tabs.forEach(t => {
      if (t.tabEl) t.tabEl.classList.toggle('active', t.id === id);
      t.iframe.classList.toggle('active', t.id === id && !!t.url);
    });

    startView.hidden = !!tab.url;
    addrInput.value = tab.url || '';
    updateNavButtons();
  }

  function navigateInTab(tab, url, push) {
    if (!url) return;
    if (push) {
      tab.history.splice(tab.historyIndex + 1);
      tab.history.push(url);
      tab.historyIndex = tab.history.length - 1;
    }
    tab.url = url;
    tab.title = extractHostname(url) || '加载中…';
    updateTabTitle(tab);
    tab.iframe.src = url;

    if (tab.id === activeTabId) {
      startView.hidden = true;
      tabs.forEach(t => {
        t.iframe.classList.toggle('active', t.id === activeTabId && !!t.url);
      });
      addrInput.value = url;
      updateNavButtons();
    }
  }

  function navigate(url, push) {
    const tab = getActiveTab();
    if (tab) navigateInTab(tab, url, push);
  }

  function updateNavButtons() {
    const tab = getActiveTab();
    if (!tab) { backBtn.disabled = true; forwardBtn.disabled = true; return; }
    backBtn.disabled    = tab.historyIndex <= 0;
    forwardBtn.disabled = tab.historyIndex >= tab.history.length - 1;
  }

  function goBack() {
    const tab = getActiveTab();
    if (!tab || tab.historyIndex <= 0) return;
    tab.historyIndex--;
    const url = tab.history[tab.historyIndex];
    tab.url = url;
    tab.title = extractHostname(url);
    updateTabTitle(tab);
    tab.iframe.src = url;
    addrInput.value = url;
    updateNavButtons();
  }

  function goForward() {
    const tab = getActiveTab();
    if (!tab || tab.historyIndex >= tab.history.length - 1) return;
    tab.historyIndex++;
    const url = tab.history[tab.historyIndex];
    tab.url = url;
    tab.title = extractHostname(url);
    updateTabTitle(tab);
    tab.iframe.src = url;
    addrInput.value = url;
    updateNavButtons();
  }

  function reload() {
    const tab = getActiveTab();
    if (!tab || !tab.url) return;
    tab.iframe.src = tab.iframe.src;
  }

  function goHome() {
    const tab = getActiveTab();
    if (!tab) return;
    tab.url = '';
    tab.history = [];
    tab.historyIndex = -1;
    tab.title = '新标签页';
    updateTabTitle(tab);
    tab.iframe.classList.remove('active');
    tab.iframe.removeAttribute('src');
    startView.hidden = false;
    addrInput.value = '';
    updateNavButtons();
  }

  backBtn.addEventListener('click', e => { e.stopPropagation(); goBack(); });
  forwardBtn.addEventListener('click', e => { e.stopPropagation(); goForward(); });
  reloadBtn.addEventListener('click', e => { e.stopPropagation(); reload(); });
  homeBtn.addEventListener('click', e => { e.stopPropagation(); goHome(); });
  externalBtn.addEventListener('click', e => {
    e.stopPropagation();
    const tab = getActiveTab();
    if (tab && tab.url) window.open(tab.url, '_blank', 'noopener');
    else showToast('当前未打开任何网页');
  });

  newTabBtn.addEventListener('click', e => {
    e.stopPropagation();
    createTab();
  });

  addrInput.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const url = normalizeUrl(addrInput.value);
    if (url) navigate(url, true);
    addrInput.blur();
  });
  addrInput.addEventListener('pointerdown', e => e.stopPropagation());

  searchIn.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const url = normalizeUrl(searchIn.value);
    if (url) { navigate(url, true); searchIn.value = ''; }
  });
  searchIn.addEventListener('pointerdown', e => e.stopPropagation());

  const tiles = [
    { name: '必应',   url: 'https://www.bing.com',  bg: 'linear-gradient(145deg,#0F82D8,#23B8A6)', letter: 'B' },
    { name: '百度',   url: 'https://www.baidu.com', bg: 'linear-gradient(145deg,#3B7CFF,#2932E1)', letter: '百' },
    { name: 'GitHub', url: 'https://github.com',    bg: 'linear-gradient(145deg,#4b5563,#111827)', letter: 'G' },
    { name: '知乎',   url: 'https://www.zhihu.com', bg: 'linear-gradient(145deg,#38bdf8,#0084ff)', letter: '知' },
  ];
  tiles.forEach(t => {
    const d = document.createElement('div');
    d.className = 'edge-tile';
    d.innerHTML = `
      <div class="edge-tile-icon" style="background:${t.bg}">${t.letter}</div>
      <div class="edge-tile-name">${t.name}</div>`;
    d.addEventListener('click', e => { e.stopPropagation(); navigate(t.url, true); });
    tilesEl.appendChild(d);
  });

  el.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    if (e.key.toLowerCase() === 't') { e.preventDefault(); createTab(); }
    else if (e.key.toLowerCase() === 'w') { e.preventDefault(); if (activeTabId) closeTab(activeTabId); }
  });

  w.edgeAPI = {
    openUrlInTab,
    getActiveTabUrl: () => getActiveTab()?.url || '',

  };

}

/* ================= 窗口操作 ================= */
function focusWin(id) {
  const w = wins.get(id);
  if (!w) return;
  activeId = id;
  w.el.style.zIndex = ++zTop;
  w.minimized = false;
  w.el.classList.remove('minimized');
  wins.forEach((v, k) => v.el.classList.toggle('focused', k === id));
  renderInfoWindows();
}

function minimizeWin(id) {
  const w = wins.get(id);
  if (!w) return;
  w.minimized = true;
  w.el.classList.add('minimized');
  if (activeId === id) activeId = null;
  renderInfoWindows();
}

function toggleMax(id) {
  const w = wins.get(id);
  if (!w) return;
  const el = w.el;
  if (w.maximized) {
    el.classList.remove('maximized');
    w.maximized = false;
    applyWinLayout(w);
  } else {
    w.maximized = true;
    el.classList.add('maximized');
  }
  focusWin(id);
}

function closeWin(id) {
  const w = wins.get(id);
  if (!w) return;
  w.el.classList.add('closing');
  setTimeout(() => {
    w.el.remove();
    wins.delete(id);
    if (activeId === id) activeId = null;
    renderInfoWindows();
  }, 180);
}

function startDrag(e, w) {
  if (w.maximized) return;
  e.preventDefault();

  const el = w.el;
  const startX = e.clientX, startY = e.clientY;
  const baseX = w.pos.x, baseY = w.pos.y;
  const maxX = window.innerWidth - 100;
  const minX = -(w.pos.w - 140);
  const maxY = window.innerHeight - 90;

  el.classList.add('dragging');
  document.body.classList.add('dragging');

  let rafId = null, pendingX = baseX, pendingY = baseY;

  function flush() {
    rafId = null;
    el.style.transform = `translate3d(${pendingX}px, ${pendingY}px, 0)`;
  }

  function onMove(ev) {
    let x = baseX + (ev.clientX - startX);
    let y = baseY + (ev.clientY - startY);
    if (x > maxX) x = maxX;
    if (x < minX) x = minX;
    if (y > maxY) y = maxY;
    if (y < 0) y = 0;
    pendingX = x; pendingY = y;
    if (!rafId) rafId = requestAnimationFrame(flush);
  }

  function onEnd() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    w.pos.x = pendingX; w.pos.y = pendingY;
    el.style.transform = `translate3d(${pendingX}px, ${pendingY}px, 0)`;
    el.classList.remove('dragging');
    document.body.classList.remove('dragging');
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onEnd);
    document.removeEventListener('pointercancel', onEnd);
  }

  document.addEventListener('pointermove', onMove, { passive: true });
  document.addEventListener('pointerup', onEnd);
  document.addEventListener('pointercancel', onEnd);
}

function startResize(e, w) {
  if (w.maximized) return;
  e.preventDefault();
  e.stopPropagation();

  const el = w.el;
  const sx = e.clientX, sy = e.clientY;
  const baseW = w.pos.w, baseH = w.pos.h;

  el.classList.add('resizing');
  document.body.classList.add('dragging');

  let rafId = null, pendingW = baseW, pendingH = baseH;

  function flush() {
    rafId = null;
    el.style.width  = pendingW + 'px';
    el.style.height = pendingH + 'px';
  }

  function onMove(ev) {
    pendingW = Math.max(isMobile ? 260 : 360, baseW + ev.clientX - sx);
    pendingH = Math.max(isMobile ? 180 : 240, baseH + ev.clientY - sy);
    if (!rafId) rafId = requestAnimationFrame(flush);
  }

  function onEnd() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    w.pos.w = pendingW; w.pos.h = pendingH;
    el.style.width  = pendingW + 'px';
    el.style.height = pendingH + 'px';
    el.classList.remove('resizing');
    document.body.classList.remove('dragging');
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onEnd);
    document.removeEventListener('pointercancel', onEnd);
  }

  document.addEventListener('pointermove', onMove, { passive: true });
  document.addEventListener('pointerup', onEnd);
  document.addEventListener('pointercancel', onEnd);
}

/* ================= 日历面板 ================= */
let calYear, calMonth;
const today = new Date();

function renderCalendar() {
  const y = calYear, m = calMonth;
  document.getElementById('calMonthLabel').textContent = `${y}年${m + 1}月`;

  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const daysPrev = new Date(y, m, 0).getDate();

  const wrap = document.getElementById('calDays');
  wrap.replaceChildren();

  for (let i = 0; i < 42; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-day';

    let day, isOther = false;
    if (i < firstDay) {
      day = daysPrev - firstDay + i + 1;
      isOther = true;
    } else if (i < firstDay + daysInMonth) {
      day = i - firstDay + 1;
    } else {
      day = i - firstDay - daysInMonth + 1;
      isOther = true;
    }

    cell.textContent = day;
    if (isOther) cell.classList.add('other');

    const isToday = !isOther && day === today.getDate() && m === today.getMonth() && y === today.getFullYear();
    if (isToday) cell.classList.add('today');

    wrap.appendChild(cell);
  }
}

  const weekdayNames = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

  }
}

function renderInfoWindows() {
  const wrap = document.getElementById('ipWindows');
  const count = document.getElementById('ipWindowCount');
  if (!wrap) return;
  wrap.replaceChildren();
  count.textContent = wins.size;

  if (wins.size === 0) {
    wrap.innerHTML = '<div class="ip-empty">暂无打开的窗口</div>';
    return;
  }

  wins.forEach((w, id) => {
    const s = w.site;
    const g = smallGlyphHTML(s, 13, 2);
    const item = document.createElement('div');
    item.className = 'ip-window-item' + (activeId === id ? ' active' : '');
    item.innerHTML = `
      <div class="ip-window-icon ${g.cls}" style="--c:${s.color || '#0078d4'}">${g.html}</div>
      <div class="ip-window-name">${s.type === 'edge' ? 'Microsoft Edge' : s.type === 'thispc' ? '此电脑' : s.name}</div>
    `;
    attachImgFallback(item.querySelector('.ip-window-icon'), 'globe', 13, 2);
    item.addEventListener('click', () => {
      focusWin(id);
      closeInfoPanel();
    });
    wrap.appendChild(item);
  });
}

let statTimer = null;
function startStatUpdate() {
  if (statTimer) return;
  updateStats();
  statTimer = setInterval(updateStats, 2000);
}
function stopStatUpdate() {
  if (statTimer) { clearInterval(statTimer); statTimer = null; }
}
function updateStats() {
  const cpu = 20 + Math.round(Math.random() * 40);
  const mem = 45 + Math.round(Math.random() * 25);
  const disk = 70 + Math.round(Math.random() * 15);

  const cpuBar = document.getElementById('statCpu');
  const memBar = document.getElementById('statMem');
  const diskBar = document.getElementById('statDisk');
  const cpuVal = document.getElementById('statCpuVal');
  const memVal = document.getElementById('statMemVal');
  const diskVal = document.getElementById('statDiskVal');

  if (cpuBar) cpuBar.style.width = cpu + '%';
  if (memBar) memBar.style.width = mem + '%';
  if (diskBar) diskBar.style.width = disk + '%';
  if (cpuVal) cpuVal.textContent = cpu + '%';
  if (memVal) memVal.textContent = mem + '%';
  if (diskVal) diskVal.textContent = disk + '%';
}

/* ================= 右键菜单 ================= */
function showCtx(x, y, items) {
  ctxMenu.replaceChildren();
  items.forEach(it => {
    if (it === '-') {
      const sep = document.createElement('div');
      sep.className = 'ctx-sep';
      ctxMenu.appendChild(sep);
      return;
    }
    const row = document.createElement('div');
    row.className = 'ctx-item' + (it.disabled ? ' disabled' : '');
    row.innerHTML = `
      <span class="ci-icon">${it.icon ? svgIcon(it.icon, 13, 2) : ''}</span>
      <span>${it.label}</span>`;
    row.addEventListener('click', () => { hideCtx(); it.action && it.action(); });
    ctxMenu.appendChild(row);
  });

  ctxMenu.classList.add('open');
  const r = ctxMenu.getBoundingClientRect();
  ctxMenu.style.left = Math.min(x, window.innerWidth  - r.width  - 8) + 'px';
  ctxMenu.style.top  = Math.min(y, window.innerHeight - r.height - 8) + 'px';
}
function hideCtx() { ctxMenu.classList.remove('open'); }

document.getElementById('desktop').addEventListener('contextmenu', e => {
  if (e.target.closest('.window') || e.target.closest('#taskbar')) return;
  e.preventDefault();
  const isDark = document.documentElement.classList.contains('dark');
  const used = sites.filter(s => !isEmptySlot(s)).length;
  showCtx(e.clientX, e.clientY, [
    { icon: 'refresh', label: '刷新',       action: renderIcons },
    { icon: 'layers',  label: '整理图标',   action: renderIcons },
    { icon: 'refresh', label: '重新读取名称', action: refreshTitles },
    '-',
    { icon: 'info',    label: '打开信息栏',  action: openInfoPanel },
    '-',
    { icon: isDark ? 'sun' : 'moon', label: isDark ? '切换到浅色模式' : '切换到深色模式', action: toggleTheme },
    '-',
    { icon: 'info',    label: `已启用 ${used} / ${SLOT_COUNT} 个位置`, disabled: true },
  ]);
});

document.addEventListener('pointerdown', e => {
  if (!e.target.closest('#ctxMenu')) hideCtx();
}, true);

async function refreshTitles() {
  showToast('正在读取本地 HTML 标题…');
  await extractLocalTitles();
  renderIcons();
  renderStart();
  renderRecommend();
  renderInfoShortcuts();
  showToast('快捷方式名称已更新');
}

/* =========================================================
   ★ 主题切换（核心修复）
   ---------------------------------------------------------------------------
   之前把变量定义在 body.dark 上，某些情况下 body 自己的样式不会重新解析
   导致颜色错乱。现在改用 html.dark，覆盖更彻底。
   ========================================================= */
function updateThemeIcons(isDark) {
  // 任务栏主题按钮
  const topBtn = document.getElementById('themeBtnTop');
  if (topBtn) {
    topBtn.innerHTML = isDark
      ? svgIcon('sun', 17, 1.7)
      : svgIcon('moon', 17, 1.7);
    topBtn.title = isDark ? '切换到浅色模式' : '切换到深色模式';
  }
  // 开始菜单主题按钮
  const smBtn = document.getElementById('themeBtn');
  if (smBtn) {
    smBtn.innerHTML = isDark
      ? svgIcon('sun', 16, 1.8)
      : svgIcon('moon', 16, 1.8);
    smBtn.title = isDark ? '切换到浅色模式' : '切换到深色模式';
  }
  // 信息栏主题按钮
  const ipBtn = document.getElementById('ipThemeBtn');
  if (ipBtn) {
    ipBtn.innerHTML = isDark
      ? svgIcon('sun', 13, 1.7)
      : svgIcon('moon', 13, 1.7);
    ipBtn.title = isDark ? '切换到浅色模式' : '切换到深色模式';
  }
}

function applyTheme(isDark) {
  // ★ 关键修复：把 .dark 加在 html 元素上，而不是 body 上
  document.documentElement.classList.toggle('dark', isDark);
  // 同时也在 body 上加一个镜像类，方便以后扩展（不影响样式）
  document.body.classList.toggle('dark', isDark);

  updateThemeIcons(isDark);

  try { localStorage.setItem('win11nav-theme-v21', isDark ? 'dark' : 'light'); } catch(_) {}
}

function toggleTheme() {
  const isDark = !document.documentElement.classList.contains('dark');
  applyTheme(isDark);
}

(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('win11nav-theme-v21'); } catch(_) {}
  const isDark = saved
    ? saved === 'dark'
    : window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(isDark);
})();

// 三个入口都绑定 toggleTheme
document.getElementById('themeBtnTop').addEventListener('click', e => {
  e.stopPropagation();
  toggleTheme();
});
document.getElementById('themeBtn').addEventListener('click', e => {
  e.stopPropagation();
  toggleTheme();
});
document.getElementById('ipThemeBtn').addEventListener('click', e => {
  e.stopPropagation();
  toggleTheme();
});

/* ================= 时钟 ================= */
function tick() {
  const d = new Date();
  clockT.textContent = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
  clockD.textContent = d.toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' });
}
tick();
setInterval(tick, 1000);

/* ================= 全局快捷键 ================= */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeStart();
    closeQuickPanel();
    closeCalendar();
    hideCtx();
    closeInfoPanel();
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    openStart();
  }
});

window.addEventListener('resize', () => {
  wins.forEach(w => {
    if (w.maximized) return;
    const maxX = window.innerWidth - 100;
    const maxY = window.innerHeight - 90;
    let changed = false;
    if (w.pos.x > maxX) { w.pos.x = maxX; changed = true; }
    if (w.pos.y > maxY) { w.pos.y = maxY; changed = true; }
    if (w.pos.x < -(w.pos.w - 140)) { w.pos.x = -(w.pos.w - 140); changed = true; }
    if (w.pos.y < 0) { w.pos.y = 0; changed = true; }
    if (changed) applyWinLayout(w);
  });
});

/* ================= 启动 ================= */
calYear = today.getFullYear();
calMonth = today.getMonth();
updateCalendarHeader();
renderCalendar();

(async function boot() {
  renderIcons();
  renderStart();
  renderRecommend();

  await extractLocalTitles();
  renderIcons();
  renderStart();
  renderRecommend();
})();
</script>

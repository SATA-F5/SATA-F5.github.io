<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>守禄的 Win11</title>
<meta name="description" content="守禄的 Win11 桌面模拟器启动页">
<link rel="icon" href="./favicon.ico">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: #000;
    color: #fff;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system,
                 "Microsoft YaHei", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 24px;
  }
  .logo { width: 88px; height: 88px; color: #fff; }
  .logo rect { fill: currentColor; }
  h1 { margin: 26px 0 8px; font-size: 26px; font-weight: 600; letter-spacing: .5px; }
  .sub { margin: 0; font-size: 13px; color: #9a9a9a; }
  .launch {
    margin-top: 34px;
    min-width: 212px;
    height: 40px;
    padding: 0 26px;
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, .35);
    background: rgba(255, 255, 255, .08);
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .launch:hover { background: rgba(255, 255, 255, .16); border-color: rgba(255, 255, 255, .6); }
  .launch:active { transform: scale(.98); }
  .launch:disabled { opacity: .55; cursor: default; }
  .hint {
    margin-top: 18px;
    max-width: 460px;
    font-size: 12px;
    color: #7a7a7a;
    line-height: 1.8;
  }
  .hint a { color: #6cb6ff; text-decoration: none; }
  .hint a:hover { text-decoration: underline; }
  .blocked {
    display: none;
    margin-top: 14px;
    max-width: 460px;
    font-size: 12px;
    line-height: 1.7;
    color: #ff9b8a;
  }
  .blocked.show { display: block; }
  .bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 2px;
    background: rgba(255, 255, 255, .07);
    overflow: hidden;
  }
  .bar i {
    display: block;
    width: 28%;
    height: 100%;
    background: #4cc2ff;
    animation: slide 1.8s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-110%); }
    100% { transform: translateX(380%); }
  }
</style>
</head>
<body>
<div class="wrap">
  <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
    <rect x="1" y="1" width="10" height="10" rx=".7"/>
    <rect x="13" y="1" width="10" height="10" rx=".7"/>
    <rect x="1" y="13" width="10" height="10" rx=".7"/>
    <rect x="13" y="13" width="10" height="10" rx=".7"/>
  </svg>
  <h1>守禄的 Win11</h1>
  <p class="sub">桌面模拟器 · 启动器</p>
  <button class="launch" id="launchBtn">启动桌面</button>
  <p class="hint">
    桌面会在新标签页中打开，这样「关机」才能真正关闭页面。<br>
    没有反应？<a href="./desktop.html">在当前标签页打开</a>（此时「关机」只能黑屏）。
  </p>
  <p class="blocked" id="blocked">浏览器拦截了新标签页。请在地址栏右侧允许弹窗后重试，或使用上面的备用链接。</p>
</div>
<div class="bar"><i></i></div>
<script>
(function () {
  var btn = document.getElementById('launchBtn');
  var blocked = document.getElementById('blocked');
  var launched = false;
  var popup = null;

  function reset() {
    launched = false;
    popup = null;
    btn.disabled = false;
    btn.textContent = '启动桌面';
  }

  function launch() {
    if (launched && popup && !popup.closed) {
      try { popup.focus(); } catch (e) {}
      return;
    }
    var win = null;
    try {
      win = window.open('./desktop.html', '_blank');
    } catch (e) {
      win = null;
    }
    if (win) {
      launched = true;
      popup = win;
      blocked.classList.remove('show');
      btn.disabled = true;
      btn.textContent = '已启动 · 请切换到新标签页';
      try { win.focus(); } catch (e) {}
      var timer = setInterval(function () {
        if (!popup || popup.closed) {
          clearInterval(timer);
          reset();
        }
      }, 900);
    } else {
      blocked.classList.add('show');
    }
  }

  btn.addEventListener('click', launch);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') launch();
  });
})();
</script>
</body>
</html>

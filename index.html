<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/png" href="./index.png?v=1"/>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>守禄的win11</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #0067c0;
  --win-bg: rgba(249, 249, 249, .94);
  --win-text: #1a1a1a;
  --win-sub: #5f5f5f;
  --win-border: rgba(255, 255, 255, .55);
  --win-shadow: 0 26px 70px rgba(0, 0, 0, .42), 0 2px 8px rgba(0, 0, 0, .22);
  --win-shadow-focus: 0 32px 84px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .15);
  --field-bg: rgba(255, 255, 255, .72);
  --field-border: rgba(0, 0, 0, .1);
  --sidebar-bg: rgba(0, 0, 0, .025);
  --frame-bg: #ffffff;
  --tb-bg: rgba(22, 22, 26, .82);
  --tb-text: #f2f2f2;
  --tb-hover: rgba(255, 255, 255, .075);
  --tb-active: rgba(255, 255, 255, .13);
  --tb-border: rgba(255, 255, 255, .085);
  --menu-bg: rgba(30, 30, 34, .95);
  --menu-text: #f2f2f2;
  --menu-sub: #a8a8a8;
  --menu-border: rgba(255, 255, 255, .1);
  --menu-field-bg: rgba(255, 255, 255, .07);
  --menu-field-border: rgba(255, 255, 255, .13);
  --menu-scroll: rgba(255, 255, 255, .25);
}

body.dark {
  --accent: #4cc2ff;
  --win-bg: rgba(32, 32, 34, .95);
  --win-text: #f2f2f2;
  --win-sub: #b0b0b0;
  --win-border: rgba(255, 255, 255, .1);
  --win-shadow: 0 26px 70px rgba(0, 0, 0, .7), 0 2px 8px rgba(0, 0, 0, .5);
  --win-shadow-focus: 0 32px 84px rgba(0, 0, 0, .8), 0 0 0 1px rgba(255, 255, 255, .18);
  --field-bg: rgba(255, 255, 255, .07);
  --field-border: rgba(255, 255, 255, .13);
  --sidebar-bg: rgba(255, 255, 255, .025);
  --frame-bg: #1e1e20;
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system,
               "Microsoft YaHei", "PingFang SC", sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  color: var(--win-text);
  background: #06101f;
  overscroll-behavior: none;
}

body.dragging iframe { pointer-events: none; }

#desktop { position: fixed; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; }

/* ============ 壁纸 ============ */
#wallpaper {
  position: absolute; left: 0; top: 0; right: 0; bottom: 0;
  background: #06101f;
  overflow: hidden;
  z-index: 0;
}
#wallpaper::before {
  content: "";
  position: absolute;
  left: -25%; top: -25%; right: -25%; bottom: -25%;
  background:
    radial-gradient(45% 45% at 22% 28%, #2563eb 0%, transparent 65%),
    radial-gradient(40% 40% at 78% 18%, #7c3aed 0%, transparent 65%),
    radial-gradient(45% 45% at 72% 82%, #0ea5e9 0%, transparent 65%),
    radial-gradient(40% 40% at 18% 78%, #1d4ed8 0%, transparent 65%);
  filter: blur(60px) saturate(1.15);
}
#wallpaper::after {
  content: "";
  position: absolute; left: 0; top: 0; right: 0; bottom: 0;
  background: radial-gradient(125% 95% at 50% 42%, transparent 38%, rgba(0, 0, 0, .55));
}

/* ============ 桌面图标层 ============ */
#icon-layer {
  position: absolute;
  left: 14px; top: 14px; right: 14px; bottom: 66px;
  display: grid;
  grid-auto-flow: column;
  grid-template-rows: repeat(auto-fill, 108px);
  grid-auto-columns: 106px;
  align-content: start;
  justify-content: start;
  overflow: hidden;
  z-index: 1;
}

.dicon {
  width: 106px;
  height: 108px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 7px;
  padding: 10px 4px;
  border-radius: 6px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: background .13s, border-color .13s;
}
.dicon:hover {
  background: rgba(255, 255, 255, .13);
  border-color: rgba(255, 255, 255, .17);
}
.dicon:active {
  background: rgba(255, 255, 255, .22);
  border-color: rgba(255, 255, 255, .4);
}

.dicon-glyph {
  width: 48px; height: 48px;
  flex-shrink: 0;
  display: grid; place-items: center;
  border-radius: 10px;
  color: #fff;
  background: linear-gradient(145deg, #6f7bff, #3a48c0);
  box-shadow: 0 5px 14px rgba(0, 0, 0, .38), inset 0 1px 0 rgba(255, 255, 255, .3);
  overflow: hidden;
}
.dicon-glyph svg { display: block; }

.dicon-glyph.edge {
  background: linear-gradient(145deg, #0F82D8 0%, #23B8A6 55%, #7BE49B 100%);
}
.dicon-glyph.thispc {
  background: linear-gradient(145deg, #5BB0F0 0%, #1E6FB8 100%);
}
.dicon-glyph.plain {
  background: transparent;
  box-shadow: none;
}
.dicon-glyph.plain img {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
  border-radius: 10px;
  filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .4));
}

.dicon-label {
  max-width: 96px;
  font-size: 11.5px;
  line-height: 1.28;
  color: #fff;
  text-align: center;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .8), 0 0 10px rgba(0, 0, 0, .5);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  word-break: break-word;
}

/* ============ 窗口层 ============ */
#windows {
  position: absolute;
  left: 0; top: 0; right: 0; bottom: 52px;
  pointer-events: none;
  z-index: 2;
}

.window {
  position: absolute;
  left: 0;
  top: 0;
  transform: translate3d(0, 0, 0);
  display: flex;
  flex-direction: column;
  min-width: 300px;
  min-height: 200px;
  border-radius: 9px;
  background: var(--win-bg);
  color: var(--win-text);
  border: 1px solid var(--win-border);
  box-shadow: var(--win-shadow);
  overflow: hidden;
  backdrop-filter: blur(24px) saturate(170%);
  -webkit-backdrop-filter: blur(24px) saturate(170%);
  pointer-events: auto;
  transition: box-shadow .15s ease, opacity .18s ease,
              background .25s ease, color .25s ease, border-color .25s ease;
}
.window.focused { box-shadow: var(--win-shadow-focus); }
.window.dragging {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  box-shadow: none !important;
  transition: none !important;
  will-change: transform;
}
.window.resizing {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  box-shadow: none !important;
  transition: none !important;
  will-change: width, height;
}
.window.maximized {
  transform: none !important;
  width: 100% !important;
  height: 100% !important;
  border-radius: 0;
  border: none;
}
.window.minimized { opacity: 0; pointer-events: none; }
.window.closing {
  opacity: 0;
  transform: scale(.94) translateY(8px);
  pointer-events: none;
  transition: opacity .15s ease, transform .15s ease;
}
.window.opening { animation: winFade .18s ease-out; }
@keyframes winFade { from { opacity: 0; } }

.titlebar {
  height: 36px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-left: 9px;
  cursor: default;
  touch-action: none;
}
.tb-app { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tb-app-icon {
  width: 18px; height: 18px;
  flex-shrink: 0;
  display: grid; place-items: center;
  border-radius: 4px;
  color: #fff;
  background: linear-gradient(145deg, var(--c), color-mix(in srgb, var(--c) 62%, #000));
  overflow: hidden;
}
.tb-app-icon.edge { background: linear-gradient(145deg, #0F82D8, #23B8A6); }
.tb-app-icon.thispc { background: linear-gradient(145deg, #5BB0F0, #1E6FB8); }
.tb-app-icon.plain { background: transparent; }
.tb-app-icon.plain img {
  width: 100%; height: 100%;
  object-fit: contain; display: block;
  border-radius: 4px;
}
.tb-title {
  font-size: 12.5px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tb-actions { display: flex; height: 100%; }

.wbtn {
  width: 44px; height: 100%;
  display: grid; place-items: center;
  border: none; background: transparent;
  color: inherit; cursor: pointer;
  transition: background .12s, color .12s;
}
.wbtn:hover { background: var(--tb-hover); }
.wbtn.close:hover { background: #c42b1c; color: #fff; }

.toolbar {
  height: 38px; flex-shrink: 0;
  display: flex; align-items: center; gap: 5px;
  padding: 0 9px 8px;
}
.nav-btn {
  width: 28px; height: 28px; flex-shrink: 0;
  display: grid; place-items: center;
  border: none; border-radius: 5px;
  background: transparent; color: inherit;
  cursor: pointer;
  transition: background .12s;
}
.nav-btn:hover { background: var(--tb-hover); }

.address {
  flex: 1; min-width: 0; height: 30px;
  display: flex; align-items: center; gap: 7px;
  padding: 0 10px; border-radius: 5px;
  background: var(--field-bg);
  border: 1px solid var(--field-border);
  transition: border-color .15s, background .25s;
}
.address:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
.address .lock { display: grid; place-items: center; opacity: .65; flex-shrink: 0; }
.address input {
  flex: 1; min-width: 0;
  border: none; outline: none; background: transparent;
  font-family: inherit; font-size: 12.5px; color: inherit;
}

.frame-wrap {
  flex: 1; position: relative;
  background: var(--frame-bg);
  overflow: hidden;
}
.frame-wrap iframe {
  width: 100%; height: 100%;
  border: none; display: block;
  background: var(--frame-bg);
}
.loader {
  position: absolute; left: 0; top: 0; right: 0; bottom: 0;
  display: grid; place-items: center;
  background: var(--win-bg);
  color: var(--win-sub);
  font-size: 12.5px; gap: 12px;
  transition: opacity .25s;
}
.loader.hide { opacity: 0; pointer-events: none; }
.spinner {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2.5px solid color-mix(in srgb, var(--accent) 25%, transparent);
  border-top-color: var(--accent);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.resize-handle {
  position: absolute; right: 0; bottom: 0;
  width: 22px; height: 22px;
  cursor: nwse-resize;
  z-index: 6;
  touch-action: none;
}
body.mobile .resize-handle { width: 32px; height: 32px; }

/* ============ Edge 浏览器 ============ */
.edge-page {
  flex: 1; display: flex; flex-direction: column; min-height: 0;
  background: var(--win-bg); color: var(--win-text);
}

/* ---- 多标签栏 ---- */
.edge-tabbar {
  height: 38px;
  flex-shrink: 0;
  display: flex;
  align-items: flex-end;
  gap: 4px;
  padding: 6px 8px 0;
  border-bottom: 1px solid var(--win-border);
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
}
.edge-tabbar::-webkit-scrollbar { display: none; }

.edge-tabs {
  display: flex;
  gap: 2px;
  align-items: flex-end;
  min-width: 0;
}

.edge-tab {
  position: relative;
  height: 28px;
  min-width: 100px;
  max-width: 200px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 6px 0 10px;
  border-radius: 6px 6px 0 0;
  font-size: 11.5px;
  color: var(--win-text);
  cursor: pointer;
  transition: background .12s;
  user-select: none;
}
.edge-tab:hover { background: var(--tb-hover); }
.edge-tab.active {
  background: var(--field-bg);
  box-shadow: 0 -1px 0 var(--win-border), 1px 0 0 var(--win-border), -1px 0 0 var(--win-border);
}
.edge-tab.active::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 1px;
  background: var(--field-bg);
}
.edge-tab-favicon {
  width: 14px; height: 14px;
  flex-shrink: 0;
  display: grid; place-items: center;
  border-radius: 3px;
  color: var(--win-sub);
  overflow: hidden;
}
.edge-tab-title {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.edge-tab-close {
  width: 18px; height: 18px;
  flex-shrink: 0;
  display: grid; place-items: center;
  border: none;
  background: transparent;
  border-radius: 4px;
  color: inherit;
  cursor: pointer;
  opacity: .55;
  transition: background .12s, opacity .12s;
}
.edge-tab-close:hover {
  background: var(--tb-active);
  opacity: 1;
}

.edge-newtab {
  width: 26px; height: 26px;
  flex-shrink: 0;
  display: grid; place-items: center;
  border: none;
  background: transparent;
  border-radius: 5px;
  color: inherit;
  cursor: pointer;
  margin-bottom: 1px;
  transition: background .12s;
}
.edge-newtab:hover { background: var(--tb-hover); }

/* ---- 工具栏 ---- */
.edge-toolbar {
  height: 44px; flex-shrink: 0;
  display: flex; align-items: center; gap: 4px;
  padding: 0 10px;
  border-bottom: 1px solid var(--win-border);
}
.edge-btn {
  width: 32px; height: 32px; flex-shrink: 0;
  display: grid; place-items: center;
  border: none; border-radius: 6px;
  background: transparent; color: inherit;
  cursor: pointer;
  transition: background .12s, opacity .12s;
}
.edge-btn:hover:not(:disabled) { background: var(--tb-hover); }
.edge-btn:active:not(:disabled) { background: var(--tb-active); }
.edge-btn:disabled { opacity: .3; cursor: default; pointer-events: none; }
.edge-btn svg { display: block; }

.edge-address {
  flex: 1; min-width: 0; height: 32px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 12px; border-radius: 16px;
  background: var(--field-bg);
  border: 1px solid var(--field-border);
  font-size: 12.5px;
  transition: border-color .15s, box-shadow .15s, background .25s;
}
.edge-address:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
.edge-address .lock { display: grid; place-items: center; opacity: .6; flex-shrink: 0; }
.edge-addr-input {
  flex: 1; min-width: 0;
  border: none; outline: none; background: transparent;
  font-family: inherit; font-size: 12.5px; color: inherit;
}
.edge-addr-input::placeholder { color: var(--win-sub); }

/* ---- 内容区 ---- */
.edge-body {
  flex: 1; position: relative;
  min-height: 0;
  overflow: hidden;
  background: var(--frame-bg);
}
.edge-frame {
  position: absolute; left: 0; top: 0; right: 0; bottom: 0;
  width: 100%; height: 100%;
  border: none;
  background: var(--frame-bg);
  display: none;
}
.edge-frame.active { display: block; }

.edge-start {
  position: absolute; left: 0; top: 0; right: 0; bottom: 0;
  overflow-y: auto;
  display: flex; flex-direction: column; align-items: center;
  padding: 54px 24px 30px;
  background:
    radial-gradient(55% 45% at 50% 22%, rgba(15, 130, 216, .1), transparent 70%),
    radial-gradient(50% 40% at 70% 90%, rgba(35, 184, 166, .08), transparent 70%),
    var(--win-bg);
}
body.dark .edge-start {
  background:
    radial-gradient(55% 45% at 50% 22%, rgba(35, 184, 166, .1), transparent 70%),
    radial-gradient(50% 40% at 70% 90%, rgba(15, 130, 216, .09), transparent 70%),
    var(--win-bg);
}
.edge-start[hidden] { display: none; }

.edge-brand { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
.edge-brand-badge {
  width: 48px; height: 48px;
  display: grid; place-items: center;
  border-radius: 12px;
  background: linear-gradient(145deg, #0F82D8, #23B8A6);
}
.edge-brand-name { font-size: 22px; font-weight: 600; letter-spacing: .2px; }

.edge-searchbox {
  width: min(540px, 92%); height: 44px;
  display: flex; align-items: center; gap: 11px;
  padding: 0 16px; border-radius: 22px;
  background: var(--field-bg);
  border: 1px solid var(--field-border);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
  transition: border-color .15s, box-shadow .15s;
}
.edge-searchbox:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
.edge-searchbox .s-ico { display: grid; place-items: center; opacity: .6; flex-shrink: 0; }
.edge-search-input {
  flex: 1; min-width: 0;
  border: none; outline: none; background: transparent;
  font-family: inherit; font-size: 14px; color: inherit;
}
.edge-search-input::placeholder { color: var(--win-sub); }

.edge-tiles {
  margin-top: 38px;
  display: grid; grid-template-columns: repeat(4, 96px);
  gap: 10px; justify-content: center;
}
.edge-tile {
  display: flex; flex-direction: column; align-items: center; gap: 9px;
  padding: 14px 6px; border-radius: 9px;
  cursor: pointer;
  transition: background .14s;
}
.edge-tile:hover { background: var(--tb-hover); }
.edge-tile-icon {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 9px; color: #fff;
  font-size: 15px; font-weight: 700;
  box-shadow: 0 3px 10px rgba(0, 0, 0, .22);
}
.edge-tile-name {
  font-size: 11.5px; max-width: 84px; text-align: center;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.edge-hint {
  margin-top: 30px;
  font-size: 11.5px;
  color: var(--win-sub);
  text-align: center;
  line-height: 1.6;
  max-width: 480px;
  opacity: .8;
}

/* ============ 此电脑 ============ */
.explorer {
  flex: 1; display: flex; flex-direction: column; min-height: 0;
  background: var(--win-bg); color: var(--win-text);
  font-size: 12.5px;
}
.exp-toolbar {
  height: 44px; flex-shrink: 0;
  display: flex; align-items: center; gap: 4px;
  padding: 0 10px;
  border-bottom: 1px solid var(--win-border);
}
.exp-nav {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border: none; border-radius: 5px;
  background: transparent; color: inherit;
  cursor: pointer; opacity: .85;
  transition: background .12s;
}
.exp-nav:hover { background: var(--tb-hover); opacity: 1; }
.exp-nav.dim { opacity: .32; pointer-events: none; }

.exp-address {
  flex: 1; min-width: 0; height: 30px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 11px; border-radius: 5px;
  background: var(--field-bg);
  border: 1px solid var(--field-border);
  font-size: 12.5px;
}
.exp-address .crumb { opacity: .85; }

.exp-search {
  width: 190px; height: 30px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 11px; border-radius: 5px;
  background: var(--field-bg);
  border: 1px solid var(--field-border);
  font-size: 12px; color: var(--win-sub);
}

.exp-body { flex: 1; display: flex; min-height: 0; }

.exp-sidebar {
  width: 200px; flex-shrink: 0;
  padding: 8px 6px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--win-border);
  overflow-y: auto;
}
.exp-side-item {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 10px; border-radius: 5px;
  cursor: default;
  transition: background .12s;
}
.exp-side-item:hover { background: var(--tb-hover); }
.exp-side-item.active { background: var(--tb-active); }
.exp-side-item .si {
  width: 16px; display: grid; place-items: center;
  flex-shrink: 0; opacity: .9;
}
.exp-side-item .si.gold  { color: #d9a53b; }
.exp-side-item .si.blue  { color: #3b82f6; }
.exp-side-item .si.green { color: #10b981; }
.exp-side-item .si.pink  { color: #ec4899; }
.exp-side-item .si.purple{ color: #a855f7; }
.exp-side-item .si.red   { color: #ef4444; }
.exp-side-item .si.gray  { color: #8a8a8a; }
body.dark .exp-side-item .si.blue { color: #60a5fa; }
body.dark .exp-side-item .si.green{ color: #34d399; }
body.dark .exp-side-item .si.gold { color: #fbbf24; }
body.dark .exp-side-item .si.pink { color: #f472b6; }
body.dark .exp-side-item .si.purple{color: #c084fc; }
body.dark .exp-side-item .si.red  { color: #f87171; }
body.dark .exp-side-item .si.gray { color: #9ca3af; }

.exp-divider { height: 1px; margin: 7px 10px; background: var(--field-border); }

.exp-main {
  flex: 1; min-width: 0;
  overflow-y: auto;
  padding: 16px 20px 24px;
}
.exp-group-title { font-size: 12.5px; font-weight: 600; margin-bottom: 10px; }
.exp-group + .exp-group { margin-top: 26px; }

.exp-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 4px;
}

.drive {
  display: flex; align-items: center; gap: 13px;
  padding: 11px 12px; border-radius: 7px;
  cursor: default; transition: background .13s;
}
.drive:hover { background: var(--tb-hover); }
.drive-icon {
  width: 42px; height: 42px; flex-shrink: 0;
  display: grid; place-items: center; border-radius: 8px;
  background: linear-gradient(145deg, #5BB0F0, #1E6FB8);
  color: #fff; box-shadow: 0 3px 10px rgba(0, 0, 0, .22);
}
.drive-info { flex: 1; min-width: 0; }
.drive-name {
  font-size: 12.5px; font-weight: 500; margin-bottom: 5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.drive-bar {
  height: 5px; border-radius: 3px;
  background: var(--field-border); overflow: hidden; margin-bottom: 5px;
}
.drive-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, #0ea5e9, #3b82f6);
}
.drive-meta { font-size: 11px; color: var(--win-sub); }

.folder {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; border-radius: 7px;
  cursor: default; transition: background .13s;
}
.folder:hover { background: var(--tb-hover); }
.folder-icon {
  width: 34px; height: 34px; flex-shrink: 0;
  display: grid; place-items: center; border-radius: 6px;
  color: #f5b93c;
  background: rgba(245, 185, 60, .16);
}
.folder-name {
  font-size: 12.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ============ 任务栏 ============ */
#taskbar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 52px;
  display: flex; align-items: center; justify-content: center;
  gap: 6px;
  padding: 0 156px 0 8px;
  background: var(--tb-bg);
  color: var(--tb-text);
  border-top: 1px solid var(--tb-border);
  backdrop-filter: blur(34px) saturate(180%);
  -webkit-backdrop-filter: blur(34px) saturate(180%);
  box-shadow: 0 -6px 24px rgba(0, 0, 0, .28);
  z-index: 500;
}

.tb-btn, .task-item {
  position: relative;
  width: 40px; height: 40px; flex-shrink: 0;
  display: grid; place-items: center;
  border: none; border-radius: 7px;
  background: transparent; color: inherit;
  cursor: default;
  transition: background .13s;
}
.tb-btn:hover, .task-item:hover { background: var(--tb-hover); }

.task-item::after {
  content: "";
  position: absolute; bottom: 2px; left: 50%;
  width: 0; height: 3px; border-radius: 2px;
  background: var(--accent);
  transform: translateX(-50%);
  transition: width .18s ease, opacity .18s;
}
.task-item.running::after { width: 14px; }
.task-item.minimized::after { width: 6px; opacity: .55; }
.task-item.active { background: var(--tb-active); }

.task-item .ti-badge {
  width: 22px; height: 22px;
  display: grid; place-items: center;
  border-radius: 5px; color: #fff;
  background: linear-gradient(145deg, var(--c), color-mix(in srgb, var(--c) 62%, #000));
  overflow: hidden;
}
.task-item .ti-badge.edge { background: linear-gradient(145deg, #0F82D8, #23B8A6); }
.task-item .ti-badge.thispc { background: linear-gradient(145deg, #5BB0F0, #1E6FB8); }
.task-item .ti-badge.plain { background: transparent; }
.task-item .ti-badge.plain img {
  width: 100%; height: 100%;
  object-fit: contain; display: block;
  border-radius: 5px;
}

#tray {
  position: absolute;
  right: 0; top: 0; bottom: 0;
  display: flex; align-items: center; gap: 2px;
  padding-right: 14px; font-size: 11.5px;
}
#tray .tray-btn {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border: none; background: transparent; color: inherit;
  cursor: pointer; border-radius: 5px;
  transition: background .12s;
}
#tray .tray-btn:hover { background: var(--tb-hover); }

#clock {
  display: flex; flex-direction: column; align-items: flex-end;
  line-height: 1.25; cursor: default; padding-left: 8px;
}
#clock .t { font-size: 12px; }
#clock .d { font-size: 11px; opacity: .75; }

/* ============ 开始菜单 ============ */
#startMenu {
  position: absolute;
  left: 50%; bottom: 62px;

  padding: 22px 24px 14px;

  color: var(--menu-text);

  opacity: 0; pointer-events: none;
  transform: translateX(-50%) translateY(16px) scale(.98);
  transition: opacity .18s ease, transform .24s cubic-bezier(.2, .9, .3, 1.05);
}
#startMenu.open {
  opacity: 1; pointer-events: auto;
  transform: translateX(-50%) translateY(0) scale(1);
}

#startSearch {
  height: 34px; flex-shrink: 0;
  display: flex; align-items: center; gap: 9px;
  padding: 0 13px; margin-bottom: 18px;
  border-radius: 17px;

  border: 1px solid var(--menu-field-border);
}
#startSearch:focus-within {

}
#startSearch .ico { display: grid; place-items: center; opacity: .65; }
#startSearch input {
  flex: 1; min-width: 0;
  border: none; outline: none; background: transparent;
  font-family: inherit; font-size: 13px; color: inherit;
}
#startSearch input::placeholder { color: var(--menu-sub); }

.sm-title { font-size: 12.5px; font-weight: 600; margin-bottom: 10px; flex-shrink: 0; }

#startGrid {
  flex: 1; overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 3px; align-content: start; padding-right: 4px;
}

.start-item {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 12px 4px; border-radius: 7px;
  cursor: pointer;
  transition: background .13s;
}
.start-item:hover { background: var(--tb-hover); }
.start-item .si-icon {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 9px; color: #fff;
  background: linear-gradient(145deg, var(--c), color-mix(in srgb, var(--c) 62%, #000));
  box-shadow: 0 3px 10px rgba(0, 0, 0, .4);
  overflow: hidden;
}
.start-item .si-icon.edge { background: linear-gradient(145deg, #0F82D8, #23B8A6); }
.start-item .si-icon.thispc { background: linear-gradient(145deg, #5BB0F0, #1E6FB8); }
.start-item .si-icon.plain {
  background: transparent;
  box-shadow: none;
}
.start-item .si-icon.plain img {
  width: 100%; height: 100%;
  object-fit: contain; display: block;
  border-radius: 9px;
  filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .4));
}
.start-item .si-name {
  font-size: 11.5px; text-align: center; line-height: 1.3;

}

.sm-footer {

  font-size: 12px;
}

  display: flex; align-items: center; gap: 9px;

}

.sm-hint { color: var(--menu-sub); font-size: 11px; }

/* ============ 右键菜单 ============ */
#ctxMenu {
  position: absolute;
  min-width: 210px;
  padding: 5px; border-radius: 8px;
  background: var(--menu-bg);
  color: var(--menu-text);

  box-shadow: 0 18px 44px rgba(0, 0, 0, .58);

}
#ctxMenu.open { opacity: 1; pointer-events: auto; transform: scale(1); }

.ctx-item {
  display: flex; align-items: center; gap: 11px;

}
.ctx-item:hover { background: var(--tb-hover); }
.ctx-item.disabled { opacity: .55; pointer-events: none; }
.ctx-item .ci-icon { width: 16px; display: grid; place-items: center; opacity: .8; }
.ctx-sep { height: 1px; margin: 4px 8px; background: var(--menu-field-border); }

/* ============ 提示条 ============ */
#toast {
  position: absolute;
  left: 50%; bottom: 76px;
  transform: translateX(-50%) translateY(16px);
  padding: 11px 20px; border-radius: 8px;
  background: var(--menu-bg);
  color: var(--menu-text);
  border: 1px solid var(--menu-border);
  box-shadow: 0 16px 44px rgba(0, 0, 0, .55);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  font-size: 12.5px; z-index: 1000;
  opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .26s cubic-bezier(.2, .9, .3, 1.05);

#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* =========================================================
   移动端降级
   ========================================================= */
body.mobile #wallpaper::before {
  filter: none;
  background:

    radial-gradient(55% 45% at 72% 82%, rgba(14, 165, 233, .7), transparent 70%),
    radial-gradient(50% 45% at 18% 78%, rgba(29, 78, 216, .8), transparent 70%),

}

body.mobile .window,
body.mobile #taskbar,
body.mobile #startMenu,
body.mobile #ctxMenu,

}

@media (max-width: 720px) {

@media (prefers-reduced-motion: reduce) {

/* =========================================================
   从本地 HTML 提取 <title>
   ========================================================= */
async function extractLocalTitles() {
  const tasks = sites.map(async (s) => {
    if (s.type !== 'local' || !s.url) return;
    try {
      const res = await fetch(s.url, { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const doc  = new DOMParser().parseFromString(text, 'text/html');
      const title = (doc.querySelector('title')?.textContent || '').trim();
      if (title) s.name = title;
    } catch (err) {
      console.warn(`[导航] 无法读取 ${s.url} 的标题：`, err.message);
    }
  });
  await Promise.all(tasks);
}

/* ================= 图标渲染工具 ================= */
function glyphHTML(s, size = 24, sw = 1.8) {
  if (s.type === 'edge')   return { html: EDGE_LOGO,      cls: 'edge'   };
  if (s.type === 'thispc') return { html: EXPLORER_SMALL, cls: 'thispc' };
  if (s.type === 'local')  return {
    html: `<img src="${s.icon}" alt="${s.name}">`,
    cls: 'plain'
  };
  if (isEmptySlot(s)) return { html: svgIcon('plus', 24, 2.2), cls: '' };
  return { html: svgIcon(s.icon, size, sw), cls: '' };
}

function smallGlyphHTML(s, size = 12, sw = 2.4) {
  if (s.type === 'edge')   return { html: svgIcon('globe', size, sw),   cls: 'edge'   };
  if (s.type === 'thispc') return { html: svgIcon('monitor', size, sw), cls: 'thispc' };
  if (s.type === 'local')  return {
    html: `<img src="${s.icon}" alt="">`,
    cls: 'plain'
  };
  return { html: svgIcon(s.icon || 'globe', size, sw), cls: '' };
}

function attachImgFallback(container, fallbackName = 'globe', size = 24, sw = 1.8) {
  const img = container.querySelector('img');
  if (!img) return;
  img.addEventListener('error', () => {
    container.classList.remove('plain');
    container.innerHTML = svgIcon(fallbackName, size, sw);
  }, { once: true });
}

const wins = new Map();

function slotVisual(s, i) {
  if (s.type === 'edge')   return { label: 'Microsoft Edge', ...glyphHTML(s), color: '#0F82D8', cls: 'edge' };
  if (s.type === 'thispc') return { label: '此电脑',          ...glyphHTML(s), color: '#1E6FB8', cls: 'thispc' };
  if (s.type === 'local')  return { label: s.name,            ...glyphHTML(s), color: s.color || '#0078d4' };
  if (isEmptySlot(s))      return { label: '添加快捷方式',     ...glyphHTML(s), color: s.color || '#0078d4' };
  return { label: s.name, ...glyphHTML(s), color: s.color || '#0078d4' };
}

function openSlot(s, i) {
  if (s.type === 'edge')   return createEdgeWin(s);
  if (s.type === 'thispc') return createThisPCWin(s);
  if (isEmptySlot(s)) {
    showToast(`空位 ${i - 1}：请在代码 SITES[${i}] 中填写`);
    return;
  }
  for (const w of wins.values()) {
    if (w.site.url === s.url) { focusWin(w.id); return; }
  }
  createWebWin(s);
}

function applyWinLayout(w) {
  if (w.maximized) return;
  const el = w.el;
  el.style.transform = `translate3d(${w.pos.x}px, ${w.pos.y}px, 0)`;
  el.style.width  = w.pos.w + 'px';
  el.style.height = w.pos.h + 'px';
}

function buildWindow({ site, title, color, bodyHTML, extraClass = '' }) {
  const id = 'w' + (++seq);
  const el = document.createElement('div');
  el.className = 'window opening ' + extraClass;
  el.dataset.id = id;

  const W = Math.min(940, Math.max(isMobile ? 280 : 380, window.innerWidth - 170));
  const H = Math.min(640, Math.max(isMobile ? 200 : 280, window.innerHeight - 210));
  const n = wins.size;
  const left = Math.max(14, Math.round((window.innerWidth  - W) / 2 - 110 + (n % 6) * 32));
  const top  = Math.max(14, Math.round((window.innerHeight - 52 - H) / 2 - 60 + (n % 6) * 28));

  el.style.zIndex = ++zTop;

  const g = smallGlyphHTML(site, 11, 2.4);
  const badge = `<div class="tb-app-icon ${g.cls}" style="--c:${color}">${g.html}</div>`;

  el.innerHTML = `
    <div class="titlebar">
      <div class="tb-app">
        ${badge}
        <div class="tb-title">${title}</div>
      </div>
      <div class="tb-actions">
        <button class="wbtn" data-act="min" title="最小化">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button class="wbtn" data-act="max" title="最大化">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
            <rect x="0.5" y="0.5" width="9" height="9" rx="1.5" stroke="currentColor"/>
          </svg>
        </button>
        <button class="wbtn close" data-act="close" title="关闭">
          <svg width="10" height="10" viewBox="0 0 10 10">
            <path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1.1"/>
          </svg>
        </button>
      </div>
    </div>
    ${bodyHTML}
    <div class="resize-handle"></div>
  `;

  winLayer.appendChild(el);
  attachImgFallback(el.querySelector('.tb-app-icon'), 'globe', 11, 2.4);

  const w = {
    id, site, el,
    minimized: false,
    maximized: false,
    pos: { x: left, y: top, w: W, h: H },
    prev: null
  };
  wins.set(id, w);

  applyWinLayout(w);
  bindWindowBase(el, w);
  focusWin(id);
  renderTasklist();
  return w;
}

function bindWindowBase(el, w) {
  const id = w.id;
  const titlebar = el.querySelector('.titlebar');
  const handle   = el.querySelector('.resize-handle');

  el.addEventListener('pointerdown', () => focusWin(id), true);

  el.querySelectorAll('.wbtn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const act = btn.dataset.act;
      if (act === 'min')   minimizeWin(id);
      if (act === 'max')   toggleMax(id);
      if (act === 'close') closeWin(id);
    });
  });

  titlebar.addEventListener('pointerdown', e => {
    if (e.target.closest('.wbtn')) return;
    startDrag(e, w);
  });
  titlebar.addEventListener('dblclick', e => {
    if (e.target.closest('.wbtn')) return;
    toggleMax(id);
  });

  handle.addEventListener('pointerdown', e => startResize(e, w));
}

function createWebWin(site) {
  const bodyHTML = `
    <div class="toolbar">

      <div class="address">

      </div>
      <button class="nav-btn" data-act="external" title="在新标签页打开">${svgIcon('external', 14, 2.1)}</button>
    </div>
    <div class="frame-wrap">
      <div class="loader">
        <div class="spinner"></div>
        <div>正在载入 ${site.name} …</div>
      </div>
      <iframe src="${site.url}" referrerpolicy="no-referrer" loading="eager"></iframe>
    </div>
  `;

  const w = buildWindow({
    site,
    title: site.name,
    color: site.color || '#0078d4',
    bodyHTML,
  });

  const el       = w.el;
  const iframe   = el.querySelector('iframe');
  const loader   = el.querySelector('.loader');
  const urlInput = el.querySelector('.url-input');

  el.querySelector('[data-act="reload"]').addEventListener('click', () => {
    loader.classList.remove('hide');
    iframe.src = iframe.src;
  });
  el.querySelector('[data-act="external"]').addEventListener('click', () => {
    window.open(iframe.src || site.url, '_blank', 'noopener');
  });

  urlInput.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    let v = urlInput.value.trim();
    if (!v) return;
    if (!/^https?:\/\//i.test(v) && !/\.html?$/i.test(v) && !/^\//.test(v)) {
      v = /^[\w-]+(\.[\w-]+)+/.test(v)
        ? 'https://' + v
        : 'https://www.bing.com/search?q=' + encodeURIComponent(v);
    }
    loader.classList.remove('hide');
    iframe.src = v;
    urlInput.value = v;
    urlInput.blur();
  });
  urlInput.addEventListener('pointerdown', e => e.stopPropagation());

  iframe.addEventListener('load', () => {
    setTimeout(() => loader.classList.add('hide'), 120);
    try {
      const inner = iframe.contentDocument?.title?.trim();
      if (inner && inner !== w.site.name) {
        w.site.name = inner;
        el.querySelector('.tb-title').textContent = inner;
        renderIcons();
        renderStart();
        renderTasklist();
      }
    } catch (_) { /* 跨域忽略 */ }
  });
}

/* =========================================================
   Edge 浏览器（多标签）
   ========================================================= */
function createEdgeWin(site) {
  const bodyHTML = `
    <div class="edge-page">
      <div class="edge-tabbar">
        <div class="edge-tabs"></div>
        <button class="edge-newtab" title="新建标签页（Ctrl+T）">
          ${svgIcon('plus', 13, 2.2)}
        </button>
      </div>
      <div class="edge-toolbar">
        <button class="edge-btn" data-edge="back" title="后退" disabled>
          ${svgIcon('back', 16, 2)}
        </button>
        <button class="edge-btn" data-edge="forward" title="前进" disabled>
          ${svgIcon('forward', 16, 2)}
        </button>
        <button class="edge-btn" data-edge="reload" title="刷新">
          ${svgIcon('reload', 16, 2)}
        </button>
        <button class="edge-btn" data-edge="home" title="主页">
          ${svgIcon('home', 16, 2)}
        </button>
        <div class="edge-address">
          <span class="lock">${svgIcon('lock', 12, 2)}</span>
          <input class="edge-addr-input" type="text" placeholder="搜索或输入网址"
                 spellcheck="false" autocomplete="off">
        </div>
        <button class="edge-btn" data-edge="external" title="在新标签页打开">
          ${svgIcon('external', 16, 2)}
        </button>
      </div>
      <div class="edge-body">
        <div class="edge-start" data-edge-view="start">
          <div class="edge-brand">
            <span class="edge-brand-badge">${EDGE_LOGO}</span>
            <div class="edge-brand-name">Microsoft Edge</div>
          </div>
          <div class="edge-searchbox">
            <span class="s-ico">${svgIcon('search', 17, 2)}</span>
            <input class="edge-search-input" type="text" placeholder="搜索网页"
                   autocomplete="off" spellcheck="false">
          </div>
          <div class="edge-tiles"></div>
          <div class="edge-hint">
            提示：部分网站出于安全策略不允许被嵌入 iframe，
            若页面空白可点击右上角「在新标签页打开」按钮。
          </div>
        </div>
      </div>
    </div>
  `;

  const w = buildWindow({
    site: { ...site, type: 'edge' },
    title: 'Microsoft Edge',
    color: '#0F82D8',
    bodyHTML,
  });

  const el = w.el;

  const tabsBar    = el.querySelector('.edge-tabs');
  const newTabBtn  = el.querySelector('.edge-newtab');
  const bodyEl     = el.querySelector('.edge-body');
  const startView  = el.querySelector('.edge-start');
  const addrInput  = el.querySelector('.edge-addr-input');
  const searchIn   = el.querySelector('.edge-search-input');
  const tilesEl    = el.querySelector('.edge-tiles');

  const backBtn    = el.querySelector('[data-edge="back"]');
  const forwardBtn = el.querySelector('[data-edge="forward"]');
  const reloadBtn  = el.querySelector('[data-edge="reload"]');
  const homeBtn    = el.querySelector('[data-edge="home"]');
  const externalBtn= el.querySelector('[data-edge="external"]');

  const tabs = [];
  let activeTabId = null;
  let tabSeq = 0;

  function normalizeUrl(v) {
    v = (v || '').trim();
    if (!v) return null;
    if (/^https?:\/\//i.test(v)) return v;
    if (/^[\w-]+(\.[\w-]+)+/.test(v)) return 'https://' + v;
    return 'https://www.bing.com/search?q=' + encodeURIComponent(v);
  }

  function extractHostname(url) {
    try {
      return new URL(url).hostname.replace(/^www\./, '');
    } catch (_) {
      return url;
    }
  }

  function getActiveTab() {
    return tabs.find(t => t.id === activeTabId) || null;
  }

  function updateTabBar() {
    tabsBar.replaceChildren();
    tabs.forEach(tab => {
      const tabEl = document.createElement('div');
      tabEl.className = 'edge-tab' + (tab.id === activeTabId ? ' active' : '');
      tabEl.dataset.tabId = tab.id;
      tabEl.title = tab.title;

      const faviconHTML = svgIcon('globe', 12, 2.2);

      tabEl.innerHTML = `
        <span class="edge-tab-favicon">${faviconHTML}</span>
        <span class="edge-tab-title">${escapeHTML(tab.title)}</span>
        <button class="edge-tab-close" title="关闭标签页">
          ${svgIcon('close', 10, 2.6)}
        </button>
      `;

      tabEl.addEventListener('click', e => {
        if (e.target.closest('.edge-tab-close')) {
          e.stopPropagation();
          closeTab(tab.id);
        } else {
          activateTab(tab.id);
        }
      });

      tabsBar.appendChild(tabEl);
      tab.tabEl = tabEl;
    });
  }

  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function updateTabTitle(tab) {
    if (!tab.tabEl) return;
    const titleEl = tab.tabEl.querySelector('.edge-tab-title');
    if (titleEl) titleEl.textContent = tab.title;
    tab.tabEl.title = tab.title;
  }

  function createTab(initialUrl = null) {
    const id = 't' + (++tabSeq);

    const iframe = document.createElement('iframe');
    iframe.className = 'edge-frame';
    iframe.dataset.tabId = id;
    iframe.referrerPolicy = 'no-referrer';
    bodyEl.appendChild(iframe);

    const tab = {
      id,
      title: '新标签页',
      url: '',
      history: [],
      historyIndex: -1,
      iframe,
      tabEl: null,
    };

    iframe.addEventListener('load', () => {
      try {
        const innerTitle = iframe.contentDocument?.title?.trim();
        if (innerTitle && innerTitle !== tab.title) {
          tab.title = innerTitle;
          updateTabTitle(tab);
        }
      } catch (_) { /* 跨域忽略 */ }
    });

    tabs.push(tab);
    updateTabBar();

    if (initialUrl) {
      navigateInTab(tab, initialUrl, true);
    } else {
      activateTab(id);
    }

    return tab;
  }

  function closeTab(id) {
    const idx = tabs.findIndex(t => t.id === id);
    if (idx < 0) return;

    const tab = tabs[idx];
    tab.iframe.remove();
    tabs.splice(idx, 1);

    if (tabs.length === 0) {
      createTab();
      return;
    }

    if (activeTabId === id) {
      const next = tabs[Math.min(idx, tabs.length - 1)];
      activateTab(next.id);
    } else {
      updateTabBar();
    }
  }

  function activateTab(id) {
    const tab = tabs.find(t => t.id === id);
    if (!tab) return;
    activeTabId = id;

    tabs.forEach(t => {
      if (t.tabEl) t.tabEl.classList.toggle('active', t.id === id);
      t.iframe.classList.toggle('active', t.id === id && !!t.url);
    });

    startView.hidden = !!tab.url;
    addrInput.value = tab.url || '';
    updateNavButtons();
  }

  function navigateInTab(tab, url, push) {
    if (!url) return;

    if (push) {
      tab.history.splice(tab.historyIndex + 1);
      tab.history.push(url);
      tab.historyIndex = tab.history.length - 1;
    }

    tab.url = url;
    tab.title = extractHostname(url) || '加载中…';
    updateTabTitle(tab);

    tab.iframe.src = url;

    if (tab.id === activeTabId) {
      startView.hidden = true;
      tabs.forEach(t => {
        t.iframe.classList.toggle('active', t.id === activeTabId && !!t.url);
      });
      addrInput.value = url;
      updateNavButtons();
    }
  }

  function navigate(url, push) {
    const tab = getActiveTab();
    if (tab) navigateInTab(tab, url, push);
  }

  function updateNavButtons() {
    const tab = getActiveTab();
    if (!tab) {
      backBtn.disabled = true;
      forwardBtn.disabled = true;
      return;
    }
    backBtn.disabled    = tab.historyIndex <= 0;
    forwardBtn.disabled = tab.historyIndex >= tab.history.length - 1;
  }

  function goBack() {
    const tab = getActiveTab();
    if (!tab || tab.historyIndex <= 0) return;
    tab.historyIndex--;
    const url = tab.history[tab.historyIndex];
    tab.url = url;
    tab.title = extractHostname(url);
    updateTabTitle(tab);
    tab.iframe.src = url;
    addrInput.value = url;
    updateNavButtons();
  }

  function goForward() {
    const tab = getActiveTab();
    if (!tab || tab.historyIndex >= tab.history.length - 1) return;
    tab.historyIndex++;
    const url = tab.history[tab.historyIndex];
    tab.url = url;
    tab.title = extractHostname(url);
    updateTabTitle(tab);
    tab.iframe.src = url;
    addrInput.value = url;
    updateNavButtons();
  }

  function reload() {
    const tab = getActiveTab();
    if (!tab || !tab.url) return;
    tab.iframe.src = tab.iframe.src;
  }

  function goHome() {
    const tab = getActiveTab();
    if (!tab) return;
    tab.url = '';
    tab.history = [];
    tab.historyIndex = -1;
    tab.title = '新标签页';
    updateTabTitle(tab);
    tab.iframe.classList.remove('active');
    tab.iframe.removeAttribute('src');
    startView.hidden = false;
    addrInput.value = '';
    updateNavButtons();
  }

  backBtn.addEventListener('click', e => { e.stopPropagation(); goBack(); });
  forwardBtn.addEventListener('click', e => { e.stopPropagation(); goForward(); });
  reloadBtn.addEventListener('click', e => { e.stopPropagation(); reload(); });
  homeBtn.addEventListener('click', e => { e.stopPropagation(); goHome(); });
  externalBtn.addEventListener('click', e => {
    e.stopPropagation();
    const tab = getActiveTab();
    if (tab && tab.url) window.open(tab.url, '_blank', 'noopener');
    else showToast('当前未打开任何网页');
  });

  newTabBtn.addEventListener('click', e => {
    e.stopPropagation();
    createTab();
  });

  addrInput.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const url = normalizeUrl(addrInput.value);
    if (url) navigate(url, true);
    addrInput.blur();
  });
  addrInput.addEventListener('pointerdown', e => e.stopPropagation());

  searchIn.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const url = normalizeUrl(searchIn.value);
    if (url) {
      navigate(url, true);
      searchIn.value = '';
    }
  });
  searchIn.addEventListener('pointerdown', e => e.stopPropagation());

  const tiles = [
    { name: '必应',   url: 'https://www.bing.com',  bg: 'linear-gradient(145deg,#0F82D8,#23B8A6)', letter: 'B' },
    { name: '百度',   url: 'https://www.baidu.com', bg: 'linear-gradient(145deg,#3B7CFF,#2932E1)', letter: '百' },
    { name: 'GitHub', url: 'https://github.com',    bg: 'linear-gradient(145deg,#4b5563,#111827)', letter: 'G' },
    { name: '知乎',   url: 'https://www.zhihu.com', bg: 'linear-gradient(145deg,#38bdf8,#0084ff)', letter: '知' },
  ];
  tiles.forEach(t => {
    const d = document.createElement('div');
    d.className = 'edge-tile';
    d.innerHTML = `
      <div class="edge-tile-icon" style="background:${t.bg}">${t.letter}</div>
      <div class="edge-tile-name">${t.name}</div>`;
    d.addEventListener('click', e => {
      e.stopPropagation();
      navigate(t.url, true);
    });
    tilesEl.appendChild(d);
  });

  el.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    if (e.key.toLowerCase() === 't') {
      e.preventDefault();
      createTab();
    } else if (e.key.toLowerCase() === 'w') {
      e.preventDefault();
      if (activeTabId) closeTab(activeTabId);
    }
  });

  createTab();
  if (!isMobile) setTimeout(() => searchIn.focus(), 180);
}

    return `
      <div class="drive">
        <div class="drive-icon">${svgIcon('hdd', 22, 1.8)}</div>
        <div class="drive-info">
          <div class="drive-name">${d.name}</div>
          <div class="drive-bar">
            <div class="drive-fill" style="width:${pct}%"></div>
          </div>
          <div class="drive-meta">${d.total - d.used} GB 可用，共 ${d.total} GB</div>
        </div>
      </div>`;
  }).join('');

  const folderHTML = folders.map(f => `
    <div class="folder">
      <div class="folder-icon">${svgIcon(f.icon, 18, 1.8)}</div>
      <div class="folder-name">${f.name}</div>
    </div>`).join('');

  const bodyHTML = `
    <div class="explorer">
      <div class="exp-toolbar">
        <button class="exp-nav dim" title="后退">${svgIcon('back', 14, 2)}</button>
        <button class="exp-nav dim" title="前进">${svgIcon('forward', 14, 2)}</button>
        <button class="exp-nav" title="刷新">${svgIcon('reload', 14, 2.1)}</button>
        <div class="exp-address">
          <span style="display:grid;place-items:center;color:var(--accent)">${svgIcon('monitor', 13, 2)}</span>
          <span class="crumb">此电脑</span>
        </div>
        <div class="exp-search">
          <span style="display:grid;place-items:center;opacity:.6">${svgIcon('search', 13, 2)}</span>
          <span>搜索“此电脑”</span>
        </div>
      </div>
      <div class="exp-body">
        <aside class="exp-sidebar">
          <div class="exp-side-item"><span class="si blue">${svgIcon('home', 14, 2)}</span>主页</div>
          <div class="exp-side-item"><span class="si purple">${svgIcon('gallery', 14, 2)}</span>图库</div>
          <div class="exp-side-item"><span class="si blue">${svgIcon('monitor', 14, 2)}</span>桌面</div>
          <div class="exp-side-item"><span class="si green">${svgIcon('down', 14, 2)}</span>下载</div>
          <div class="exp-side-item"><span class="si gold">${svgIcon('doc', 14, 2)}</span>文档</div>
          <div class="exp-side-item"><span class="si pink">${svgIcon('image', 14, 2)}</span>图片</div>
          <div class="exp-side-item"><span class="si purple">${svgIcon('note', 14, 2)}</span>音乐</div>
          <div class="exp-side-item"><span class="si red">${svgIcon('film', 14, 2)}</span>视频</div>
          <div class="exp-divider"></div>
          <div class="exp-side-item active"><span class="si blue">${svgIcon('monitor', 14, 2)}</span>此电脑</div>
          <div class="exp-side-item"><span class="si gray">${svgIcon('net', 14, 2)}</span>网络</div>
        </aside>
        <main class="exp-main">
          <div class="exp-group">
            <div class="exp-group-title">设备和驱动器 (${drives.length})</div>
            <div class="exp-grid">${driveHTML}</div>
          </div>
          <div class="exp-group">
            <div class="exp-group-title">文件夹 (${folders.length})</div>
            <div class="exp-grid">${folderHTML}</div>
          </div>
        </main>
      </div>
    </div>
  `;

  const w = buildWindow({
    site: { ...site, type: 'thispc' },
    title: '此电脑',
    color: '#1E6FB8',
    bodyHTML,
  });

  w.el.querySelectorAll('.exp-side-item').forEach(it => {
    it.addEventListener('click', () => {
      w.el.querySelectorAll('.exp-side-item').forEach(x => x.classList.remove('active'));
      it.classList.add('active');
    });
  });
}

/* ================= 窗口操作 ================= */
function focusWin(id) {
  const w = wins.get(id);
  if (!w) return;
  activeId = id;
  w.el.style.zIndex = ++zTop;
  w.minimized = false;
  w.el.classList.remove('minimized');
  wins.forEach((v, k) => v.el.classList.toggle('focused', k === id));
  renderTasklist();
}

function minimizeWin(id) {
  const w = wins.get(id);
  if (!w) return;
  w.minimized = true;
  w.el.classList.add('minimized');
  if (activeId === id) activeId = null;
  renderTasklist();
}

function toggleMax(id) {
  const w = wins.get(id);
  if (!w) return;
  const el = w.el;
  if (w.maximized) {
    el.classList.remove('maximized');
    w.maximized = false;
    applyWinLayout(w);
  } else {
    w.maximized = true;
    el.classList.add('maximized');
  }
  focusWin(id);
}

function closeWin(id) {
  const w = wins.get(id);
  if (!w) return;
  w.el.classList.add('closing');
  setTimeout(() => {
    w.el.remove();
    wins.delete(id);
    if (activeId === id) activeId = null;
    renderTasklist();
  }, 200);
}

function startDrag(e, w) {
  if (w.maximized) return;
  e.preventDefault();

  const el = w.el;
  const startX = e.clientX;
  const startY = e.clientY;
  const baseX = w.pos.x;
  const baseY = w.pos.y;

  const maxX = window.innerWidth - 100;
  const minX = -(w.pos.w - 140);
  const maxY = window.innerHeight - 90;

  el.classList.add('dragging');
  document.body.classList.add('dragging');

  let rafId = null;
  let pendingX = baseX;
  let pendingY = baseY;

  function flush() {
    rafId = null;
    el.style.transform = `translate3d(${pendingX}px, ${pendingY}px, 0)`;
  }

  function onMove(ev) {
    let x = baseX + (ev.clientX - startX);
    let y = baseY + (ev.clientY - startY);
    if (x > maxX) x = maxX;
    if (x < minX) x = minX;
    if (y > maxY) y = maxY;
    if (y < 0) y = 0;
    pendingX = x;
    pendingY = y;
    if (!rafId) rafId = requestAnimationFrame(flush);
  }

  function onEnd() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    w.pos.x = pendingX;
    w.pos.y = pendingY;
    el.style.transform = `translate3d(${pendingX}px, ${pendingY}px, 0)`;
    el.classList.remove('dragging');
    document.body.classList.remove('dragging');

    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onEnd);
    document.removeEventListener('pointercancel', onEnd);
  }

  document.addEventListener('pointermove', onMove, { passive: true });
  document.addEventListener('pointerup', onEnd);
  document.addEventListener('pointercancel', onEnd);
}

function startResize(e, w) {
  if (w.maximized) return;
  e.preventDefault();
  e.stopPropagation();

  const el = w.el;
  const sx = e.clientX, sy = e.clientY;
  const baseW = w.pos.w, baseH = w.pos.h;

  el.classList.add('resizing');
  document.body.classList.add('dragging');

  let rafId = null;
  let pendingW = baseW;
  let pendingH = baseH;

  function flush() {
    rafId = null;
    el.style.width  = pendingW + 'px';
    el.style.height = pendingH + 'px';
  }

  function onMove(ev) {
    pendingW = Math.max(isMobile ? 260 : 360, baseW + ev.clientX - sx);
    pendingH = Math.max(isMobile ? 180 : 240, baseH + ev.clientY - sy);
    if (!rafId) rafId = requestAnimationFrame(flush);
  }

  function onEnd() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    w.pos.w = pendingW;
    w.pos.h = pendingH;
    el.style.width  = pendingW + 'px';
    el.style.height = pendingH + 'px';
    el.classList.remove('resizing');
    document.body.classList.remove('dragging');
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onEnd);
    document.removeEventListener('pointercancel', onEnd);
  }

  document.addEventListener('pointermove', onMove, { passive: true });
  document.addEventListener('pointerup', onEnd);
  document.addEventListener('pointercancel', onEnd);
}

function renderTasklist() {
  tasklist.replaceChildren();
  wins.forEach((w, id) => {
    const s = w.site;
    const g = smallGlyphHTML(s, 12, 2.4);

    const b = document.createElement('button');
    b.className = 'task-item running'
      + (w.minimized ? ' minimized' : '')
      + (activeId === id ? ' active' : '');
    b.title = s.type === 'edge' ? 'Microsoft Edge' : s.type === 'thispc' ? '此电脑' : s.name;
    b.innerHTML = `<span class="ti-badge ${g.cls}" style="--c:${s.color || '#0078d4'}">${g.html}</span>`;
    attachImgFallback(b.querySelector('.ti-badge'), 'globe', 12, 2.4);
    b.addEventListener('click', () => {
      if (w.minimized) focusWin(id);
      else if (activeId === id) minimizeWin(id);
      else focusWin(id);
    });
    b.addEventListener('contextmenu', e => { e.preventDefault(); closeWin(id); });
    tasklist.appendChild(b);
  });
}

/* ================= 桌面图标 ================= */
function renderIcons() {
  iconLayer.replaceChildren();
  sites.forEach((s, i) => {
    const v = slotVisual(s, i);
    const d = document.createElement('div');
    d.className = 'dicon';

    if (isEmptySlot(s)) d.title = `空快捷方式 ${i - 1}　·　在代码 SITES[${i}] 中填写`;
    else if (s.type === 'edge')   d.title = 'Microsoft Edge';
    else if (s.type === 'thispc') d.title = '此电脑';
    else d.title = `${s.name}\n${s.url}`;

    d.innerHTML = `
      <div class="dicon-glyph${v.cls ? ' ' + v.cls : ''}" style="--c1:${v.color}">${v.html}</div>
      <div class="dicon-label">${v.label}</div>
    `;

    attachImgFallback(d.querySelector('.dicon-glyph'), 'globe', 24, 1.8);

    d.addEventListener('pointerdown', e => e.stopPropagation());
    d.addEventListener('click', e => {
      e.stopPropagation();
      openSlot(s, i);
    });

    iconLayer.appendChild(d);
  });
}

document.getElementById('desktop').addEventListener('pointerdown', e => {
  if (e.target.closest('.dicon') || e.target.closest('.window')
      || e.target.closest('#taskbar') || e.target.closest('#startMenu')
      || e.target.closest('#ctxMenu')) return;
  closeStart();
  hideCtx();
});

/* ================= 开始菜单 ================= */
function renderStart(filter = '') {
  const kw = filter.trim().toLowerCase();
  const list = sites.map((s, i) => ({ s, i }))
    .filter(({ s }) => {
      if (isEmptySlot(s)) return false;
      if (!kw) return true;
      const name = s.type === 'edge' ? 'Microsoft Edge' : s.type === 'thispc' ? '此电脑' : s.name;
      return name.toLowerCase().includes(kw);
    });

  startGrid.replaceChildren();

  if (!list.length) {
    const tip = document.createElement('div');
    tip.style.cssText = 'grid-column:1/-1;padding:34px 10px;text-align:center;font-size:12.5px;opacity:.6;';
    const used = sites.filter(s => !isEmptySlot(s)).length;
    tip.textContent = used ? '没有匹配的快捷方式' : '尚未配置任何快捷方式';
    startGrid.appendChild(tip);
    return;
  }

  list.forEach(({ s, i }) => {
    const v = slotVisual(s, i);
    const item = document.createElement('div');
    item.className = 'start-item';
    item.innerHTML = `
      <div class="si-icon${v.cls ? ' ' + v.cls : ''}" style="--c:${v.color}">${v.html}</div>
      <div class="si-name">${v.label}</div>
    `;
    attachImgFallback(item.querySelector('.si-icon'), 'globe', 18, 2.1);
    item.addEventListener('click', () => { openSlot(s, i); closeStart(); });
    startGrid.appendChild(item);
  });
}

function openStart() {
  startMenu.classList.add('open');
  startInput.value = '';
  renderStart('');
  if (!isMobile) setTimeout(() => startInput.focus(), 80);
}
function closeStart() { startMenu.classList.remove('open'); }

document.getElementById('startBtn').addEventListener('click', e => {
  e.stopPropagation();
  startMenu.classList.contains('open') ? closeStart() : openStart();
});

startInput.addEventListener('input', e => renderStart(e.target.value));
startInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeStart();
  if (e.key === 'Enter') {
    const first = startGrid.querySelector('.start-item');
    if (first) first.click();
  }
});
startMenu.addEventListener('pointerdown', e => e.stopPropagation());

/* ================= 右键菜单 ================= */
function showCtx(x, y, items) {
  ctxMenu.replaceChildren();
  items.forEach(it => {
    if (it === '-') {
      const sep = document.createElement('div');
      sep.className = 'ctx-sep';
      ctxMenu.appendChild(sep);
      return;
    }
    const row = document.createElement('div');
    row.className = 'ctx-item' + (it.disabled ? ' disabled' : '');
    row.innerHTML = `
      <span class="ci-icon">${it.icon ? svgIcon(it.icon, 13, 2) : ''}</span>
      <span>${it.label}</span>`;
    row.addEventListener('click', () => { hideCtx(); it.action && it.action(); });
    ctxMenu.appendChild(row);
  });

  ctxMenu.classList.add('open');
  const r = ctxMenu.getBoundingClientRect();
  ctxMenu.style.left = Math.min(x, window.innerWidth  - r.width  - 8) + 'px';
  ctxMenu.style.top  = Math.min(y, window.innerHeight - r.height - 8) + 'px';
}
function hideCtx() { ctxMenu.classList.remove('open'); }

document.getElementById('desktop').addEventListener('contextmenu', e => {
  if (e.target.closest('.window') || e.target.closest('#taskbar')) return;
  e.preventDefault();
  const isDark = document.body.classList.contains('dark');
  const used = sites.filter(s => !isEmptySlot(s)).length;
  showCtx(e.clientX, e.clientY, [
    { icon: 'refresh', label: '刷新桌面',  action: renderIcons },
    { icon: 'layers',  label: '整理图标',  action: renderIcons },
    { icon: 'refresh', label: '重新读取名称', action: refreshTitles },
    '-',
    { icon: isDark ? 'sun' : 'moon', label: isDark ? '窗口浅色模式' : '窗口深色模式', action: toggleTheme },
    { icon: 'close',   label: '关闭全部窗口', action: closeAllWins },
    '-',
    { icon: 'info',    label: `已启用 ${used} / ${SLOT_COUNT} 个位置`, disabled: true },
  ]);
});

document.addEventListener('pointerdown', e => {
  if (!e.target.closest('#ctxMenu')) hideCtx();
}, true);

async function refreshTitles() {
  showToast('正在读取本地 HTML 标题…');
  await extractLocalTitles();
  renderIcons();
  renderStart();
  renderTasklist();
  showToast('快捷方式名称已更新');
}

/* ================= 主题 / 任务栏 ================= */
function toggleTheme() {
  const isDark = !document.body.classList.contains('dark');
  document.body.classList.toggle('dark', isDark);
  document.getElementById('themeBtn').innerHTML = svgIcon(isDark ? 'sun' : 'moon', 15, 2);
  try { localStorage.setItem('win11nav-theme-v12', isDark ? 'dark' : 'light'); } catch(_) {}
}

(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('win11nav-theme-v12'); } catch(_) {}
  const isDark = saved ? saved === 'dark' : true;
  document.body.classList.toggle('dark', isDark);
  document.getElementById('themeBtn').innerHTML = svgIcon(isDark ? 'sun' : 'moon', 15, 2);
})();

document.getElementById('themeBtn').addEventListener('click', toggleTheme);

function closeAllWins() { [...wins.keys()].forEach(id => closeWin(id)); }
document.getElementById('closeAllBtn').innerHTML = svgIcon('power', 15, 2);
document.getElementById('closeAllBtn').addEventListener('click', closeAllWins);

document.getElementById('taskbar').addEventListener('contextmenu', e => {
  if (e.target.closest('.task-item') || e.target.closest('.tb-btn')) return;
  e.preventDefault();
  showCtx(e.clientX, e.clientY - 210, [
    { icon: 'close', label: '关闭全部窗口', action: closeAllWins },
    { icon: 'moon',  label: '切换窗口主题', action: toggleTheme },
  ]);
});

/* ================= 时钟 ================= */
function tick() {
  const d = new Date();
  clockT.textContent = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
  clockD.textContent = d.toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' });
}
tick();
setInterval(tick, 1000);

/* ================= 快捷键 ================= */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeStart(); hideCtx(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    openStart();
  }
});

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    wins.forEach(w => {
      if (w.maximized) return;
      const maxX = window.innerWidth - 100;
      const maxY = window.innerHeight - 90;
      let changed = false;
      if (w.pos.x > maxX) { w.pos.x = maxX; changed = true; }
      if (w.pos.y > maxY) { w.pos.y = maxY; changed = true; }
      if (w.pos.x < -(w.pos.w - 140)) { w.pos.x = -(w.pos.w - 140); changed = true; }
      if (w.pos.y < 0) { w.pos.y = 0; changed = true; }
      if (changed) applyWinLayout(w);
    });
  }, 150);
});

/* ================= 静态图标 ================= */
document.getElementById('searchIco').innerHTML = svgIcon('search', 14, 2);
document.getElementById('avatarIco').innerHTML = svgIcon('user', 14, 2);
document.getElementById('smHint').textContent = `${sites.filter(s => !isEmptySlot(s)).length} / ${SLOT_COUNT} 已配置`;

/* =========================================================
   启动：先渲染默认名，再异步读取本地 HTML 标题
   ========================================================= */
(async function boot() {
  renderIcons();
  renderStart();
  renderTasklist();

  await extractLocalTitles();
  renderIcons();
  renderStart();
  renderTasklist();
})();
</script>
</body>
</html>
